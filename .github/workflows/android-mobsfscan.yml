name: Android SAST (MobSF Scan)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  mobsf-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug

      - name: Install MobSF Scanner
        run: |
          python -m pip install --upgrade pip
          pip install mobsfscan

      - name: Run MobSF Scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/mobsf"
          mobsfscan .. > "$GITHUB_WORKSPACE/mobsf/mobsfscan.txt" || true

      - name: Upload MobSF Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-mobsf-report
          path: ${{ github.workspace }}/mobsf/

      - name: Build Summary
        if: always()
        run: |
          echo "Android DAST Summary (MobSF Scan)" > "$GITHUB_WORKSPACE/summary.txt"
          echo "APK Build: Completed" >> "$GITHUB_WORKSPACE/summary.txt"
          echo "MobSF Scan: Completed" >> "$GITHUB_WORKSPACE/summary.txt"

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-dast-summary
          path: ${{ github.workspace }}/summary.txt
