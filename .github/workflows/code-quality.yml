name: 1a) Code Quality and Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"

    - cron: "0 12 * * *"
    - cron: "0 20 * * *"
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  api-quality-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: 9.0.x

      - name: Restore Dependencies
        run: dotnet restore api/api.sln

      - name: Run Tests with Coverage
        run: |
          dotnet test api/Pocketree.Api.Tests/Pocketree.Api.Tests.csproj \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Generate Coverage Report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:TestResults/**/coverage.cobertura.xml \
            -targetdir:coverage-report \
            "-reporttypes:Html;TextSummary"

      - name: Build Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = {
            "summary": "API Code Quality & Coverage",
            "coverage_summary": ""
          }
          summary_path = Path("coverage-report/Summary.txt")
          if summary_path.exists():
            summary["coverage_summary"] = summary_path.read_text(encoding="utf-8", errors="ignore")

          Path("summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          Path("summary.txt").write_text(
            "API Code Quality & Coverage\n\n" + summary.get("coverage_summary", ""),
            encoding="utf-8"
          )
          PY
          cat summary.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: api-coverage-report
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: api-coverage-summary
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

  android-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug || true

      - name: Summarize Lint Severities
        if: always()
        run: |
          report="${{ github.workspace }}/android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path(r"""${{ github.workspace }}/android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt""")
          data = {"summary": "Android Lint Summary"}
          if report.exists():
            text = report.read_text(encoding="utf-8", errors="ignore")
            data.update({
              "critical": text.lower().count("severity: fatal"),
              "high": text.lower().count("severity: error"),
              "medium": text.lower().count("severity: warning"),
              "low": text.lower().count("severity: information")
            })
          else:
            data["error"] = "Lint report not found."
          Path("summary.json").write_text(json.dumps(data, indent=2), encoding="utf-8")
          lines = [
            "Android Lint Summary",
            f"Critical: {data.get('critical', 0)}",
            f"High: {data.get('high', 0)}",
            f"Medium: {data.get('medium', 0)}",
            f"Low: {data.get('low', 0)}",
          ]
          if data.get("error"):
            lines.append(f"Error: {data['error']}")
          Path("summary.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat summary.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: android-lint-report
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: android-lint-summary
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

  ml-service-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          path: .
          base: ${{ github.event.before }}
          head: ${{ github.sha }}

      - name: Lint Checks (pre-commit equivalent)
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          import yaml

          root = Path(".").resolve()
          exclude_dirs = {".git", ".venv", "node_modules", "bin", "obj", ".idea", ".vscode"}

          def should_skip(path: Path) -> bool:
            for part in path.parts:
              if part in exclude_dirs:
                return True
            return False

          files = [p for p in root.rglob("*") if p.is_file() and not should_skip(p)]

          # check-merge-conflict
          conflict_hits = []
          for p in files:
            try:
              text = p.read_text(encoding="utf-8", errors="ignore")
            except Exception:
              continue
            if any(token in text for token in ("<<<<<<<", "=======", ">>>>>>>")):
              conflict_hits.append(str(p))

          # trailing-whitespace + end-of-file-fixer checks
          trailing_ws = []
          no_final_newline = []
          for p in files:
            try:
              data = p.read_bytes()
            except Exception:
              continue
            if not data:
              continue
            try:
              text = data.decode("utf-8", errors="ignore")
            except Exception:
              continue
            lines = text.splitlines()
            if any(line.rstrip("\r\n") != line.rstrip("\r\n").rstrip() for line in lines):
              trailing_ws.append(str(p))
            if not text.endswith("\n"):
              no_final_newline.append(str(p))

          # check-yaml + check-json
          yaml_errors = []
          json_errors = []
          for p in files:
            if p.suffix in {".yaml", ".yml"}:
              try:
                yaml.safe_load(p.read_text(encoding="utf-8", errors="ignore"))
              except Exception as e:
                yaml_errors.append(f"{p}: {e}")
            elif p.suffix == ".json":
              try:
                json.loads(p.read_text(encoding="utf-8", errors="ignore"))
              except Exception as e:
                json_errors.append(f"{p}: {e}")

          errors = []
          if conflict_hits:
            errors.append("Merge conflict markers found:\n" + "\n".join(conflict_hits))
          if trailing_ws:
            errors.append("Trailing whitespace found:\n" + "\n".join(trailing_ws))
          if no_final_newline:
            errors.append("Missing final newline:\n" + "\n".join(no_final_newline))
          if yaml_errors:
            errors.append("YAML parse errors:\n" + "\n".join(yaml_errors))
          if json_errors:
            errors.append("JSON parse errors:\n" + "\n".join(json_errors))

          if errors:
            print("\n\n".join(errors))
            sys.exit(1)
          print("Lint checks passed.")
          PY

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-service/requirements.txt -r ml-service/requirements-dev.txt

      - name: Run ML Service Tests
        run: |
          pytest ml-service/tests --junitxml=ml-service-test-results.xml

      - name: Run ML Service v2 Tests
        run: |
          pytest ml-service-v2/tests --junitxml=ml-service-v2-test-results.xml

      - name: Run ML Service v3 Tests
        run: |
          pytest ml-service-v3/tests --junitxml=ml-service-v3-test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-service-test-results
          path: |
            ${{ github.workspace }}/ml-service-test-results.xml
            ${{ github.workspace }}/ml-service-v2-test-results.xml
            ${{ github.workspace }}/ml-service-v3-test-results.xml

      - name: Build Summary
        if: always()
        run: |
          cat > summary.json <<'JSON'
          {
            "summary": "ML Service Tests",
            "status": "Completed"
          }
          JSON
          cat > summary.txt <<'TXT'
          ML Service Tests
          Status: Completed
          TXT
          cat summary.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-service-quality-summary
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'java-kotlin', 'python' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.31.10
        with:
          languages: ${{ matrix.language }}

      - name: Build (C#)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: 9.0.x

      - name: Compile (C#)
        if: matrix.language == 'csharp'
        run: dotnet build api/api.sln --configuration Release

      - name: Build (Java/Kotlin)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Compile (Java/Kotlin)
        if: matrix.language == 'java-kotlin'
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Autobuild (Python)
        if: matrix.language == 'python'
        uses: github/codeql-action/autobuild@v4.31.10

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.31.10
        with:
          output: codeql-results

      - name: Upload CodeQL Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ github.workspace }}/codeql-results/**/*.sarif

      - name: Step Summary
        if: always()
        run: |
          echo "CodeQL (${{ matrix.language }}): Completed" >> $GITHUB_STEP_SUMMARY

