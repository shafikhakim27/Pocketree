name: Code Quality & Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "15 4 * * *"

permissions:
  contents: read

jobs:
  api-quality-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore Dependencies
        run: dotnet restore api/api.sln

      - name: Run Tests with Coverage
        run: |
          dotnet test api/Pocketree.Api.Tests/Pocketree.Api.Tests.csproj \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Generate Coverage Report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:TestResults/**/coverage.cobertura.xml \
            -targetdir:coverage-report \
            "-reporttypes:Html;TextSummary"

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-coverage-report
          path: |
            ${{ github.workspace }}/TestResults/**/coverage.cobertura.xml
            ${{ github.workspace }}/coverage-report/

      - name: Build Summary
        if: always()
        run: |
          echo "API Code Quality & Coverage" > "$GITHUB_WORKSPACE/summary.txt"
          if [ -f coverage-report/Summary.txt ]; then
            cat coverage-report/Summary.txt >> "$GITHUB_WORKSPACE/summary.txt"
          fi

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-coverage-summary
          path: ${{ github.workspace }}/summary.txt

  android-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug || true

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-lint-report
          path: |
            ${{ github.workspace }}/android/app/build/reports/lint-results-debug.html
            ${{ github.workspace }}/android/app/build/reports/lint-results-debug.xml
            ${{ github.workspace }}/android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt

      - name: Build Summary
        if: always()
        run: |
          echo "Android Lint: Completed" > "$GITHUB_WORKSPACE/summary.txt"

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-lint-summary
          path: ${{ github.workspace }}/summary.txt
