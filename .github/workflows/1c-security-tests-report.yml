name: 1c) Security Tests Report

on:
  workflow_dispatch:
  schedule:
    - cron: "6 16 * * *"
    - cron: "6 22 * * *"
    - cron: "6 4 * * *"
    - cron: "6 10 * * *"
permissions:
  contents: read
  actions: read

jobs:
  build-security-report:
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      WORKFLOWS: |
        3c-api-dast.yml
        4c-ml-dast.yml
        2b-android-mobsfscan-sast.yml
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: TruffleHog Scan (repo)
        run: |
          docker run --rm -v "$PWD":/repo trufflesecurity/trufflehog:latest \
            git file:///repo --since-commit=$(git rev-parse HEAD~1) \
            --json > trufflehog.json

      - name: Upload TruffleHog Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: trufflehog-report
          path: ${{ github.workspace }}/trufflehog.json

      - name: Prepare workspace
        run: |
          mkdir -p report/current
          mkdir -p report/previous

      - name: Download latest two successful runs per workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          while IFS= read -r wf; do
            [ -z "$wf" ] && continue
            echo "Fetching latest two success runs for $wf"
            run_ids=$(gh api repos/${{ github.repository }}/actions/workflows/$wf/runs --jq '.workflow_runs[] | select(.conclusion=="success") | .id' | head -n 2 || true)
            latest_id=$(echo "$run_ids" | sed -n '1p' || true)
            prev_id=$(echo "$run_ids" | sed -n '2p' || true)

            if [ -n "${latest_id:-}" ]; then
              echo "Downloading latest artifacts for $wf ($latest_id)"
              mkdir -p "report/current/$wf"
              gh run download "$latest_id" -D "report/current/$wf" || echo "No artifacts for $wf (latest)"
            else
              echo "No successful runs found for $wf"
            fi

            if [ -n "${prev_id:-}" ]; then
              echo "Downloading previous artifacts for $wf ($prev_id)"
              mkdir -p "report/previous/$wf"
              gh run download "$prev_id" -D "report/previous/$wf" || echo "No artifacts for $wf (previous)"
            else
              echo "No previous successful run for $wf"
            fi
          done <<< "$WORKFLOWS"

      - name: Build Security Report
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from datetime import datetime

          root = Path("report")
          current = root / "current"
          previous = root / "previous"

          def find_files(base, patterns):
            files = []
            for pat in patterns:
              files.extend(base.rglob(pat))
            return files

          def parse_zap(path: Path):
            try:
              data = json.loads(path.read_text(encoding="utf-8", errors="ignore"))
            except Exception:
              return {"total": 0, "high_confidence": 0, "by_risk": {}}
            alerts = []
            for site in data.get("site", []):
              alerts.extend(site.get("alerts", []))
            high_conf = [a for a in alerts if str(a.get("confidence", "")).lower() == "high"]
            by_risk = {}
            for a in alerts:
              risk = (
                str(a.get("riskdesc", "")).split(" ")[0].strip().capitalize()
                or str(a.get("risk", "")).strip().capitalize()
                or str(a.get("riskcode", "")).strip()
              )
              if not risk:
                risk = "Unknown"
              by_risk[risk] = by_risk.get(risk, 0) + 1
            return {"total": len(alerts), "high_confidence": len(high_conf), "by_risk": by_risk}

          def parse_mobsfscan(path: Path):
            try:
              data = json.loads(path.read_text(encoding="utf-8", errors="ignore"))
              if isinstance(data, dict):
                return {
                  "total": data.get("total", 0),
                  "by_severity": data.get("by_severity", {})
                }
            except Exception:
              pass
            return {"total": 0, "by_severity": {}}

          def get_latest(base, patterns):
            files = find_files(base, patterns)
            if not files:
              return None
            return max(files, key=lambda p: p.stat().st_mtime)

          def summarize(workflow):
            cur_base = current / workflow
            prev_base = previous / workflow

            if "android" in workflow:
              cur_file = get_latest(cur_base, ["mobsfscan.json"])
              prev_file = get_latest(prev_base, ["mobsfscan.json"])
              cur = parse_mobsfscan(cur_file) if cur_file else None
              prev = parse_mobsfscan(prev_file) if prev_file else None
              return {"type": "mobsfscan", "current": cur, "previous": prev}
            else:
              cur_file = get_latest(cur_base, ["zap_report.json"])
              prev_file = get_latest(prev_base, ["zap_report.json"])
              cur = parse_zap(cur_file) if cur_file else None
              prev = parse_zap(prev_file) if prev_file else None
              return {"type": "zap", "current": cur, "previous": prev}

          workflows = ["3c-api-dast.yml", "4c-ml-dast.yml", "2b-android-mobsfscan-sast.yml"]
          results = {wf: summarize(wf) for wf in workflows}

          report_dir = root / "out"
          report_dir.mkdir(parents=True, exist_ok=True)
          report_obj = {
            "generated": datetime.utcnow().isoformat() + "Z",
            "workflows": results,
            "identified_issues": [],
            "fixes_applied": [],
            "rescanning_results": [],
            "author_sections": [],
            "notes": [
              "Detailed scan artifacts are available in the workflow run artifacts.",
              "Android DAST workflow was renamed to MobSF SAST (2b-android-mobsfscan-sast.yml).",
              "Populate identified_issues, fixes_applied, and rescanning_results as part of the remediation workflow."
            ]
          }

          # Build author sections (2nd most recent -> most recent)
          try:
            import subprocess
            raw = subprocess.check_output(
              ["git", "log", "-n", "2", "--pretty=format:%H|%an <%ae>%n%B---END---"],
              text=True, encoding="utf-8"
            ).strip()
            recent_entries = [e.strip() for e in raw.split("---END---") if e.strip()]
          except Exception:
            recent_entries = []

          for entry in reversed(recent_entries):
            lines = entry.splitlines()
            header = lines[0] if lines else ""
            author = header.split("|", 1)[1] if "|" in header else "Unknown"
            body_lines = lines[1:] if len(lines) > 1 else []
            issues = []
            fixes = []
            rescans = []
            for line in body_lines:
              if line.startswith("SEC-ISSUES:"):
                issues.append(line.split("SEC-ISSUES:", 1)[1].strip())
              elif line.startswith("SEC-FIXES:"):
                fixes.append(line.split("SEC-FIXES:", 1)[1].strip())
              elif line.startswith("SEC-RESCAN:"):
                rescans.append(line.split("SEC-RESCAN:", 1)[1].strip())

            report_obj["author_sections"].append({
              "author": author.strip(),
              "identified_issues": [],
              "fixes_applied": [],
              "rescanning_results": []
            })
            # Attach parsed tag lines
            if issues:
              report_obj["author_sections"][-1]["identified_issues"] = issues[:3]
            if fixes:
              report_obj["author_sections"][-1]["fixes_applied"] = fixes[:3]
            if rescans:
              report_obj["author_sections"][-1]["rescanning_results"] = rescans[:3]
          (report_dir / "security-report.json").write_text(json.dumps(report_obj, indent=2), encoding="utf-8")

          lines = []
          lines.append("Security Testing Report")
          lines.append(f"Generated: {report_obj['generated']}")
          lines.append("")
          for wf, res in results.items():
            lines.append(f"{wf}:")
            cur = res.get("current")
            prev = res.get("previous")
            if not cur:
              lines.append("  Current: no data")
              lines.append("")
              continue
            if res.get("type") == "zap":
              lines.append(f"  Current alerts: {cur.get('total', 0)} (high confidence: {cur.get('high_confidence', 0)})")
              if cur.get("by_risk"):
                lines.append(f"  Current by risk: {cur.get('by_risk')}")
              if prev:
                lines.append(f"  Previous alerts: {prev.get('total', 0)} (high confidence: {prev.get('high_confidence', 0)})")
                if prev.get("by_risk"):
                  lines.append(f"  Previous by risk: {prev.get('by_risk')}")
              else:
                lines.append("  Previous alerts: n/a")
            else:
              lines.append(f"  Current findings: {cur.get('total', 0)}")
              if cur.get("by_severity"):
                lines.append(f"  Current by severity: {cur.get('by_severity')}")
              if prev:
                lines.append(f"  Previous findings: {prev.get('total', 0)}")
                if prev.get("by_severity"):
                  lines.append(f"  Previous by severity: {prev.get('by_severity')}")
              else:
                lines.append("  Previous findings: n/a")
            lines.append("")
          lines.append("Notes:")
          for note in report_obj["notes"]:
            lines.append(f"- {note}")
          lines.append("")
          lines.append("Author Sections (2nd most recent -> most recent):")
          if report_obj["author_sections"]:
            for section in report_obj["author_sections"]:
              lines.append(f"- {section['author']}")
              lines.append("  Identified Issues:")
              if section["identified_issues"]:
                for item in section["identified_issues"]:
                  lines.append(f"    - {item}")
              else:
                lines.append("    - (none)")
              lines.append("  Fixes Applied:")
              if section["fixes_applied"]:
                for item in section["fixes_applied"]:
                  lines.append(f"    - {item}")
              else:
                lines.append("    - (none)")
              lines.append("  Re-scanning Results:")
              if section["rescanning_results"]:
                for item in section["rescanning_results"]:
                  lines.append(f"    - {item}")
              else:
                lines.append("    - (none)")
          else:
            lines.append("- (no author data)")
          lines.append("")
          lines.append("Identified Issues:")
          if report_obj["identified_issues"]:
            for item in report_obj["identified_issues"]:
              lines.append(f"- {item}")
          else:
            lines.append("- (none)")
          lines.append("")
          lines.append("Fixes Applied:")
          if report_obj["fixes_applied"]:
            for item in report_obj["fixes_applied"]:
              lines.append(f"- {item}")
          else:
            lines.append("- (none)")
          lines.append("")
          lines.append("Re-scanning Results:")
          if report_obj["rescanning_results"]:
            for item in report_obj["rescanning_results"]:
              lines.append(f"- {item}")
          else:
            lines.append("- (none)")
          (report_dir / "security-report.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat report/out/security-report.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload Security Report
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: security-report
          path: |
            ${{ github.workspace }}/report/out/security-report.json
            ${{ github.workspace }}/report/out/security-report.txt

  build-contribution-report:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Generate Contribution Report
        run: |
          mkdir -p report
          python - <<'PY'
          import json
          import subprocess
          from datetime import datetime
          from pathlib import Path

          repo = "${{ github.repository }}"

          shortlog = subprocess.check_output(["git", "shortlog", "-sne"], text=True, encoding="utf-8")
          commits_by_author = []
          for line in shortlog.strip().splitlines():
            parts = line.strip().split("\t", 1)
            if len(parts) == 2:
              count, author = parts
              commits_by_author.append({"author": author, "commits": int(count)})

          recent = subprocess.check_output(
            ["git", "log", "-n", "500", "--pretty=format:%h %ad %an %s", "--date=short"],
            text=True, encoding="utf-8"
          )
          recent_activity = recent.strip().splitlines() if recent.strip() else []

          report = {
            "title": "Contribution Report",
            "repository": repo,
            "generated": datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
            "commits_by_author": commits_by_author,
            "recent_activity": recent_activity
          }

          Path("report/contribution-report.json").write_text(
            json.dumps(report, indent=2), encoding="utf-8"
          )
          lines = [
            "Contribution Report",
            f"Repository: {repo}",
            f"Generated: {report['generated']}",
            "",
            "Commits by Author:"
          ]
          lines += [f"{c['commits']}\t{c['author']}" for c in commits_by_author]
          lines.append("")
          lines.append("Recent Activity (last 500 commits):")
          lines += recent_activity
          Path("report/contribution-report.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat report/contribution-report.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload Contribution Report
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: contribution-report
          path: |
            ${{ github.workspace }}/report/contribution-report.json
            ${{ github.workspace }}/report/contribution-report.txt
