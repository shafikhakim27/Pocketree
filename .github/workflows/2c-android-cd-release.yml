name: 2c) Android CD Release Build

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["2a) Android CI"]
    types:
      - completed

jobs:
  build-release-android:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build App Bundle (Release)
        run: ./gradlew bundleRelease

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: pocketree-release.aab
          path: ${{ github.workspace }}/android/app/build/outputs/bundle/release/app-release.aab

      - name: Step Summary
        if: always()
        run: |
          echo "Android Release Build: Completed" >> $GITHUB_STEP_SUMMARY

