name: Security Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read
  actions: read

jobs:
  build-report:
    runs-on: ubuntu-latest
    env:
      WORKFLOWS: |
        api-dast.yml
        ml-dast.yml
        android-mobsfscan.yml
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Prepare workspace
        run: |
          mkdir -p report/current
          mkdir -p report/previous

      - name: Download latest two successful runs per workflow
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          while IFS= read -r wf; do
            [ -z "$wf" ] && continue
            echo "Fetching latest two success runs for $wf"
            run_ids=$(gh api repos/${{ github.repository }}/actions/workflows/$wf/runs --jq '.workflow_runs[] | select(.conclusion=="success") | .id' | head -n 2 || true)
            latest_id=$(echo "$run_ids" | sed -n '1p' || true)
            prev_id=$(echo "$run_ids" | sed -n '2p' || true)

            if [ -n "${latest_id:-}" ]; then
              echo "Downloading latest artifacts for $wf ($latest_id)"
              mkdir -p "report/current/$wf"
              gh run download "$latest_id" -D "report/current/$wf" || echo "No artifacts for $wf (latest)"
            else
              echo "No successful runs found for $wf"
            fi

            if [ -n "${prev_id:-}" ]; then
              echo "Downloading previous artifacts for $wf ($prev_id)"
              mkdir -p "report/previous/$wf"
              gh run download "$prev_id" -D "report/previous/$wf" || echo "No artifacts for $wf (previous)"
            else
              echo "No previous successful run for $wf"
            fi
          done <<< "$WORKFLOWS"

      - name: Build Security Report
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from datetime import datetime

          root = Path("report")
          current = root / "current"
          previous = root / "previous"

          def find_files(base, patterns):
            files = []
            for pat in patterns:
              files.extend(base.rglob(pat))
            return files

          def parse_zap(path: Path):
            try:
              data = json.loads(path.read_text(encoding="utf-8", errors="ignore"))
            except Exception:
              return {"total": 0, "high_confidence": 0, "by_risk": {}}
            alerts = []
            for site in data.get("site", []):
              alerts.extend(site.get("alerts", []))
            high_conf = [a for a in alerts if str(a.get("confidence", "")).lower() == "high"]
            by_risk = {}
            for a in alerts:
              risk = (
                str(a.get("riskdesc", "")).split(" ")[0].strip().capitalize()
                or str(a.get("risk", "")).strip().capitalize()
                or str(a.get("riskcode", "")).strip()
              )
              if not risk:
                risk = "Unknown"
              by_risk[risk] = by_risk.get(risk, 0) + 1
            return {"total": len(alerts), "high_confidence": len(high_conf), "by_risk": by_risk}

          def parse_mobsfscan(path: Path):
            try:
              data = json.loads(path.read_text(encoding="utf-8", errors="ignore"))
              if isinstance(data, dict):
                return {
                  "total": data.get("total", 0),
                  "by_severity": data.get("by_severity", {})
                }
            except Exception:
              pass
            return {"total": 0, "by_severity": {}}

          def get_latest(base, patterns):
            files = find_files(base, patterns)
            if not files:
              return None
            return max(files, key=lambda p: p.stat().st_mtime)

          def summarize(workflow):
            cur_base = current / workflow
            prev_base = previous / workflow

            if "android" in workflow:
              cur_file = get_latest(cur_base, ["mobsfscan.json"])
              prev_file = get_latest(prev_base, ["mobsfscan.json"])
              cur = parse_mobsfscan(cur_file) if cur_file else None
              prev = parse_mobsfscan(prev_file) if prev_file else None
              return {"type": "mobsfscan", "current": cur, "previous": prev}
            else:
              cur_file = get_latest(cur_base, ["zap_report.json"])
              prev_file = get_latest(prev_base, ["zap_report.json"])
              cur = parse_zap(cur_file) if cur_file else None
              prev = parse_zap(prev_file) if prev_file else None
              return {"type": "zap", "current": cur, "previous": prev}

          workflows = ["api-dast.yml", "ml-dast.yml", "android-mobsfscan.yml"]
          results = {wf: summarize(wf) for wf in workflows}

          def delta(cur, prev):
            if not cur or not prev:
              return "n/a"
            if cur["total"] > prev["total"]:
              return f"+{cur['total'] - prev['total']}"
            if cur["total"] < prev["total"]:
              return f"-{prev['total'] - cur['total']}"
            return "0"

          report_dir = root / "out"
          report_dir.mkdir(parents=True, exist_ok=True)
          report_obj = {
            "generated": datetime.utcnow().isoformat() + "Z",
            "workflows": results,
            "notes": [
              "Detailed scan artifacts are available in the workflow run artifacts.",
              "Android DAST workflow was renamed to MobSF SAST (android-mobsfscan.yml)."
            ]
          }
          (report_dir / "security-report.json").write_text(json.dumps(report_obj, indent=2), encoding="utf-8")

          lines = []
          lines.append("Security Testing Report")
          lines.append(f"Generated: {report_obj['generated']}")
          lines.append("")
          for wf, res in results.items():
            lines.append(f"{wf}:")
            cur = res.get("current")
            prev = res.get("previous")
            if not cur:
              lines.append("  Current: no data")
              lines.append("")
              continue
            if res.get("type") == "zap":
              lines.append(f"  Current alerts: {cur.get('total', 0)} (high confidence: {cur.get('high_confidence', 0)})")
              if cur.get("by_risk"):
                lines.append(f"  Current by risk: {cur.get('by_risk')}")
              if prev:
                lines.append(f"  Previous alerts: {prev.get('total', 0)} (high confidence: {prev.get('high_confidence', 0)})")
                if prev.get("by_risk"):
                  lines.append(f"  Previous by risk: {prev.get('by_risk')}")
              else:
                lines.append("  Previous alerts: n/a")
            else:
              lines.append(f"  Current findings: {cur.get('total', 0)}")
              if cur.get("by_severity"):
                lines.append(f"  Current by severity: {cur.get('by_severity')}")
              if prev:
                lines.append(f"  Previous findings: {prev.get('total', 0)}")
                if prev.get("by_severity"):
                  lines.append(f"  Previous by severity: {prev.get('by_severity')}")
              else:
                lines.append("  Previous findings: n/a")
            lines.append("")
          lines.append("Notes:")
          for note in report_obj["notes"]:
            lines.append(f"- {note}")
          (report_dir / "security-report.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload Security Report
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: security-report
          path: |
            ${{ github.workspace }}/report/out/security-report.json
            ${{ github.workspace }}/report/out/security-report.txt

