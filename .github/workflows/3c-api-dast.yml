name: 3c) API DAST

on:
  workflow_dispatch:
  schedule:
    - cron: "45 16 * * *"
    - cron: "45 22 * * *"
    - cron: "45 4 * * *"
    - cron: "45 10 * * *"
  workflow_run:
    workflows: ["3b) API CD (Deploy - Azure)"]
    types:
      - completed

jobs:
  zap-baseline:
    continue-on-error: true
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://pocketree-api.azurewebsites.net
          cmd_options: "-J zap_report.json -r zap_report.html -T 1200 -z \"-config connection.timeoutInSecs=120 -config spider.maxDuration=5\""
          fail_action: false

      - name: Fail on High Confidence Alerts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("zap_report.json")
          if not report.exists():
              print("ZAP report not found; skipping confidence check.")
              raise SystemExit(0)

          data = json.loads(report.read_text(encoding="utf-8", errors="ignore"))
          alerts = []
          for site in data.get("site", []):
              alerts.extend(site.get("alerts", []))

          high = [a for a in alerts if str(a.get("confidence", "")).lower() == "high"]
          print(f"Total alerts: {len(alerts)} | High confidence: {len(high)}")
          if high:
              raise SystemExit(1)
          PY

      - name: Build ZAP Text Report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("zap_report.json")
          out = Path("zap_report.txt")
          if not report.exists():
            out.write_text("ZAP report not found.\n", encoding="utf-8")
            raise SystemExit(0)
          data = json.loads(report.read_text(encoding="utf-8", errors="ignore") or "{}")
          alerts = []
          for site in data.get("site", []):
            alerts.extend(site.get("alerts", []))
          high = [a for a in alerts if str(a.get("confidence", "")).lower() == "high"]
          lines = [
            "ZAP Baseline Report",
            f"Total alerts: {len(alerts)}",
            f"High confidence alerts: {len(high)}"
          ]
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Build DAST Rich View
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import html

          report = Path("zap_report.json")
          total = high = 0
          status = "PASS"
          if report.exists():
            data = json.loads(report.read_text(encoding="utf-8", errors="ignore") or "{}")
            alerts = []
            for site in data.get("site", []):
              alerts.extend(site.get("alerts", []))
            total = len(alerts)
            high = len([a for a in alerts if str(a.get("confidence", "")).lower() == "high"])
            if high:
              status = "FAIL"
            elif total:
              status = "WARN"
          else:
            status = "FAIL"

          Path("dast-richview.html").write_text(
            "<!doctype html><html><head><meta charset='utf-8'/>"
            "<title>API DAST Summary</title>"
            "<style>body{font-family:Arial,sans-serif;margin:24px;}table{border-collapse:collapse;width:420px;}"
            "th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#f3f4f6;}"
            ".ok{color:#0f7b0f;font-weight:600}.warn{color:#b26a00;font-weight:600}.fail{color:#b00020;font-weight:600}</style>"
            "</head><body><h2>API DAST Summary</h2>"
            f"<p>Status: <span class='{status.lower()}'>{status}</span></p>"
            "<table><tr><th>Metric</th><th>Count</th></tr>"
            f"<tr><td>Total alerts</td><td>{html.escape(str(total))}</td></tr>"
            f"<tr><td>High confidence</td><td>{html.escape(str(high))}</td></tr>"
            "</table></body></html>",
            encoding="utf-8"
          )
          PY

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: zap-report
          path: |
            ${{ github.workspace }}/zap_report.json
            ${{ github.workspace }}/zap_report.txt
            ${{ github.workspace }}/dast-richview.html

      - name: Build Summary
        if: always()
        run: |
          cat > summary.json <<'JSON'
          {
            "summary": "API DAST Summary",
            "zap_baseline": "Completed"
          }
          JSON
          cat > summary.txt <<'TXT'
          API DAST Summary
          ZAP Baseline: Completed
          TXT
          cat summary.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: api-dast-summary
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

