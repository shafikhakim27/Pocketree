name: 1b) Code Coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "3 16 * * *"
    - cron: "3 22 * * *"
    - cron: "3 4 * * *"
    - cron: "3 10 * * *"
permissions:
  contents: read
  actions: read

env:
  COVERAGE_MIN: "70"

jobs:
  api-code-coverage:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: 9.0.x

      - name: Restore Dependencies
        run: dotnet restore api/api.sln

      - name: Run Tests with Coverage
        run: |
          dotnet test api/Pocketree.Api.Tests/Pocketree.Api.Tests.csproj \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults

      - name: Generate Coverage Report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator \
            -reports:TestResults/**/coverage.cobertura.xml \
            -targetdir:coverage-report \
            "-reporttypes:Html;TextSummary"

      - name: Build Summary (Strict)
        if: always()
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          summary = {
            "summary": "API Code Coverage",
            "coverage_summary": ""
          }
          summary_path = Path("coverage-report/Summary.txt")
          if not summary_path.exists():
            summary["error"] = "Coverage summary not found."
            Path("summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
            Path("summary.txt").write_text(
              "API Code Coverage\n\nError: Coverage summary not found.\n",
              encoding="utf-8"
            )
            print("Coverage summary missing; failing in strict mode.")
            sys.exit(1)

          text = summary_path.read_text(encoding="utf-8", errors="ignore")
          summary["coverage_summary"] = text

          # Extract line coverage percentage (best-effort)
          line_match = re.search(r"Line coverage\\s*:\\s*([0-9.]+)%", text)
          line_cov = float(line_match.group(1)) if line_match else None
          summary["line_coverage"] = line_cov

          Path("summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          lines = ["API Code Coverage"]
          if line_cov is not None:
            lines.append(f"Line coverage: {line_cov:.2f}%")
          lines.append("")
          lines.append(summary.get("coverage_summary", ""))
          Path("summary.txt").write_text("\n".join(lines), encoding="utf-8")

          min_cov = float("${{ env.COVERAGE_MIN }}")
          if line_cov is not None and line_cov < min_cov:
            print(f"Line coverage {line_cov:.2f}% is below minimum {min_cov:.2f}%")
            sys.exit(1)
          PY
          cat summary.txt >> $GITHUB_STEP_SUMMARY

      - name: Strict Summary
        if: always()
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json
          from pathlib import Path
          data = {}
          summary = Path("summary.json")
          if summary.exists():
            data = json.loads(summary.read_text(encoding="utf-8", errors="ignore"))
          line_cov = data.get("line_coverage")
          status = "PASS"
          if data.get("error"):
            status = "FAIL"
          elif line_cov is not None and line_cov < float("${{ env.COVERAGE_MIN }}"):
            status = "FAIL"
          print("Strict Summary")
          print(f"- Line coverage: {line_cov if line_cov is not None else 'n/a'}")
          print(f"- Minimum required: ${{ env.COVERAGE_MIN }}%")
          print(f"- Status: {status}")
          PY

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: api-coverage-report
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: api-coverage-summary
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt
