name: ML Service CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Snyk Python Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=ml-service/requirements.txt --severity-threshold=high --skip-unresolved --json-file-output=ml-service-snyk.json --sarif-file-output=ml-service-snyk.sarif

      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r ml-service/ -lll -iii -f json -o bandit-report.json

      - name: Upload Snyk SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ml-service-snyk.sarif

      - name: Upload Snyk Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-snyk-report
          path: |
            ml-service-snyk.json
            ml-service-snyk.sarif

      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-bandit-report
          path: bandit-report.json

      - name: Security Summary
        if: always()
        run: |
          echo "ML Service Security Scans: Completed" >> $GITHUB_STEP_SUMMARY

      - name: Build Summary
        if: always()
        run: |
          echo "ML Service CI Summary" > summary.txt
          echo "Snyk: Completed" >> summary.txt
          echo "Bandit: Completed" >> summary.txt

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-service-ci-summary
          path: summary.txt
