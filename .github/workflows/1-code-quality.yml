name: 1. Code Quality

on:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *"
  push:
    branches: ["main", "develop"]
    paths:
      - 'api/**'
      - 'ml-service/**'
      - 'ml-service-chat/**'
      - 'ml-service-classify/**'
      - 'android/**'
      - '.github/workflows/1-code-quality.yml'
permissions:
  contents: read
  security-events: write

jobs:
  android-quality:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: android-lint-report
          path: |
            ${{ github.workspace }}/android/app/build/reports/lint-results-debug.html
            ${{ github.workspace }}/android/app/build/reports/lint-results-debug.xml
            ${{ github.workspace }}/android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'java-kotlin', 'python' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.31.10
        with:
          languages: ${{ matrix.language }}

      - name: Build (C#)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v5.1.0
        with:
          dotnet-version: 9.0.x

      - name: Compile (C#)
        if: matrix.language == 'csharp'
        run: dotnet build api/api.sln --configuration Release

      - name: Build (Java/Kotlin)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Compile (Java/Kotlin)
        if: matrix.language == 'java-kotlin'
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Autobuild (Python)
        if: matrix.language == 'python'
        uses: github/codeql-action/autobuild@v4.31.10

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.31.10
        with:
          output: codeql-results

      - name: Upload CodeQL Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ github.workspace }}/codeql-results/**/*.sarif


