name: 5. Android CI/CD

on:
  workflow_dispatch:
  schedule:
    - cron: "9 16 * * *"
    - cron: "9 22 * * *"
    - cron: "9 4 * * *"
    - cron: "9 10 * * *"
  push:
    branches: ["main", "develop"]
    paths:
      - 'android/**'
      - '.github/workflows/5-android-ci-cd.yml'

jobs:
  build-android:
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug

      - name: Build App Bundle (Release)
        run: ./gradlew bundleRelease

  maestro-ui:
    continue-on-error: true
    needs: build-android
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug

      - name: Install emulator libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 libxcb-xinerama0 libx11-6 libx11-xcb1

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro Flow (non-blocking stage)
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: |
            cd "$GITHUB_WORKSPACE"
            mkdir -p "$GITHUB_WORKSPACE/maestro-report"
            mkdir -p "$GITHUB_WORKSPACE/.maestro/recordings"
            mkdir -p "$GITHUB_WORKSPACE/.maestro/screenshots"
            adb wait-for-device
            adb install "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
            maestro test "$GITHUB_WORKSPACE/android/.maestro/flow.yaml" --format junit --output "$GITHUB_WORKSPACE/maestro-report/report.xml"

      - name: Upload Maestro Artifacts
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: maestro-ui-results
          path: |
            ${{ github.workspace }}/maestro-report/
            ${{ github.workspace }}/.maestro/recordings/
            ${{ github.workspace }}/.maestro/screenshots/
          include-hidden-files: true

