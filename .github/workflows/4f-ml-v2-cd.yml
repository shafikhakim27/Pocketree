name: 4f) ML CD (v2 Cloud Run)

on:
  workflow_dispatch:
  schedule:
    - cron: "33 16 * * *"
    - cron: "33 22 * * *"
    - cron: "33 4 * * *"
    - cron: "33 10 * * *"
  workflow_run:
    workflows: ["4d) ML CI (v2 Cloud Run)"]
    types:
      - completed

env:
  GCP_PROJECT_ID: pocketree-ml-service
  GCP_REGION: asia-southeast1
  AR_REPO: pocketree-ml
  IMAGE_NAME: pocketree-ml-v2
  SERVICE_NAME: pocketree-ml

jobs:
  build-and-deploy-ml:
    continue-on-error: true
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Ensure Artifact Registry exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location "${{ env.GCP_REGION }}" || \
          gcloud artifacts repositories create "${{ env.AR_REPO }}" \
            --repository-format=docker \
            --location "${{ env.GCP_REGION }}" \
            --description="Pocketree ML images"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push ML Docker image
        id: build_image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          docker build -f ml-service-v2/Dockerfile -t "$IMAGE_URI" ml-service-v2
          docker push "$IMAGE_URI"

      - name: Free Disk Space
        run: |
          docker system prune -af
          docker builder prune -af

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build_image.outputs.image_uri }}
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Build Trivy Text Report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path("trivy-report.json")
          out = Path("trivy-report.txt")
          if not src.exists():
            out.write_text("Trivy report not found.\n", encoding="utf-8")
            raise SystemExit(0)
          data = json.loads(src.read_text(encoding="utf-8", errors="ignore") or "{}")
          results = data.get("Results", [])
          lines = ["Trivy Report", f"Targets: {len(results)}"]
          for r in results:
            target = r.get("Target", "unknown")
            vulns = r.get("Vulnerabilities", []) or []
            lines.append(f"- {target}: {len(vulns)} findings")
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Relaxed Trivy Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          errors = 0
          warnings = 0
          details = []

          src = Path("trivy-report.json")
          if src.exists():
            data = json.loads(src.read_text(encoding="utf-8", errors="ignore") or "{}")
            results = data.get("Results", []) or []
            sev_counts = {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0}
            for r in results:
              for v in (r.get("Vulnerabilities") or []):
                sev = str(v.get("Severity", "")).upper()
                if sev in sev_counts:
                  sev_counts[sev] += 1
            errors = sev_counts["CRITICAL"] + sev_counts["HIGH"]
            warnings = sev_counts["MEDIUM"] + sev_counts["LOW"]
            details.append(
              "trivy critical={CRITICAL} high={HIGH} medium={MEDIUM} low={LOW}".format(**sev_counts)
            )
          else:
            details.append("trivy report missing")

          out = Path("relaxed-checks-trivy.txt")
          suggestions = []
          if errors or warnings:
            suggestions.append("Review Trivy findings and patch base image/deps.")
          else:
            suggestions.append("No action needed.")
          out.write_text(
            "errors={0} warnings={1}\n{2}\nSuggested actions: {3}\n".format(
              errors, warnings, "\n".join(details), ", ".join(suggestions)
            ),
            encoding="utf-8"
          )
          md = Path("relaxed-checks-trivy.md")
          md.write_text(
            "\n".join([
              "## ML v2 Trivy (relaxed)",
              "",
              "| Metric | Count |",
              "| --- | ---: |",
              f"| Errors | {errors} |",
              f"| Warnings | {warnings} |",
              "",
              "**Suggested actions**",
              f"- {suggestions[0]}",
              "",
              "Details:",
              *[f"- {d}" for d in details],
              ""
            ]),
            encoding="utf-8"
          )
          html = Path("relaxed-checks-trivy.html")
          html.write_text(
            "\n".join([
              "<!doctype html>",
              "<html lang=\"en\">",
              "  <head>",
              "    <meta charset=\"utf-8\" />",
              "    <title>ML v2 Trivy (relaxed)</title>",
              "    <style>",
              "      body {{ font-family: Arial, sans-serif; margin: 24px; }}",
              "      table {{ border-collapse: collapse; width: 360px; }}",
              "      th, td {{ border: 1px solid #ddd; padding: 8px; text-align: left; }}",
              "      th {{ background: #f3f4f6; }}",
              "      .section {{ margin-top: 16px; }}",
              "      ul {{ margin: 6px 0 0 18px; }}",
              "    </style>",
              "  </head>",
              "  <body>",
              "    <h2>ML v2 Trivy (relaxed)</h2>",
              "    <table>",
              "      <tr><th>Metric</th><th>Count</th></tr>",
              "      <tr><td>Errors</td><td>{errors}</td></tr>",
              "      <tr><td>Warnings</td><td>{warnings}</td></tr>",
              "    </table>",
              "    <div class=\"section\"><strong>Suggested actions</strong>",
              "      <ul><li>{suggestions[0]}</li></ul>",
              "    </div>",
              "    <div class=\"section\"><strong>Details</strong>",
              "      <ul>",
              "        {''.join(f'<li>{d}</li>' for d in details)}",
              "      </ul>",
              "    </div>",
              "  </body>",
              "</html>"
            ]),
            encoding="utf-8"
          )
          PY
          cat relaxed-checks-trivy.txt >> $GITHUB_STEP_SUMMARY
          cat relaxed-checks-trivy.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: trivy-report-ml-v2
          path: |
            ${{ github.workspace }}/trivy-report.json
            ${{ github.workspace }}/trivy-report.txt

      - name: Upload Relaxed Trivy Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-v2-relaxed-checks-trivy
          path: |
            ${{ github.workspace }}/relaxed-checks-trivy.txt
            ${{ github.workspace }}/relaxed-checks-trivy.md
            ${{ github.workspace }}/relaxed-checks-trivy.html

      - name: Build Relaxed Dashboard
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import html

          files = sorted(Path(".").glob("relaxed-checks*.txt"))
          rows = []
          strict_errors = 0
          strict_warnings = 0
          for f in files:
            lines = f.read_text(encoding="utf-8", errors="ignore").splitlines()
            header = lines[0] if lines else ""
            errors = warnings = "0"
            if header.startswith("errors="):
              parts = dict(p.split("=") for p in header.split() if "=" in p)
              errors = parts.get("errors", "0")
              warnings = parts.get("warnings", "0")
            actions = ""
            for line in lines:
              if line.lower().startswith("suggested actions:"):
                actions = line.split(":", 1)[1].strip()
                break
            rows.append((f.name, errors, warnings, actions))
            strict_errors += int(errors)
            strict_warnings += int(warnings)

          status = "PASS"
          if strict_errors > 0:
            status = "FAIL"
          elif strict_warnings > 0:
            status = "WARN"

          html_out = Path("relaxed-dashboard.html")
          html_out.write_text(
            "<!doctype html><html><head><meta charset='utf-8'/>"
            "<title>Relaxed Checks Dashboard</title>"
            "<style>body{font-family:Arial,sans-serif;margin:24px;}table{border-collapse:collapse;width:100%;}"
            "th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#f3f4f6;}"
            ".ok{color:#0f7b0f;font-weight:600}.warn{color:#b26a00;font-weight:600}.fail{color:#b00020;font-weight:600}</style>"
            "</head><body><h2>Relaxed Checks Dashboard</h2>"
            "<h3>Strictest Checks (Summary)</h3>"
            f"<p>Status: <span class='{status.lower()}'>{status}</span></p>"
            "<table><tr><th>Metric</th><th>Count</th></tr>"
            f"<tr><td>Errors</td><td>{strict_errors}</td></tr>"
            f"<tr><td>Warnings</td><td>{strict_warnings}</td></tr>"
            "</table>"
            "<table><tr><th>Check</th><th>Errors</th><th>Warnings</th><th>Suggested actions</th></tr>" +
            "".join(
              f"<tr><td>{html.escape(name)}</td><td>{html.escape(err)}</td><td>{html.escape(warn)}</td>"
              f"<td>{html.escape(act)}</td></tr>"
              for name, err, warn, act in rows
            ) +
            "</table></body></html>",
            encoding="utf-8"
          )
          PY

      - name: Upload Relaxed Dashboard
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-v2-relaxed-dashboard
          path: ${{ github.workspace }}/relaxed-dashboard.html

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --image "$IMAGE_URI" \
            --port 8080 \
            --cpu 4 \
            --memory 12Gi \
            --timeout 1200 \
            --concurrency 2 \
            --min-instances 1 \
            --max-instances 3 \
            --cpu-boost \
            --ingress all \
            --set-env-vars "GUNICORN_CMD_ARGS=--timeout 600 --preload --workers 1" \
            --allow-unauthenticated

      - name: Step Summary
        if: always()
        run: |
          echo "ML v2 CD: Cloud Run deploy completed" >> $GITHUB_STEP_SUMMARY
