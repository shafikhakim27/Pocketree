name: Run All Pipelines (Develop)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger develop workflows
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const workflows = [
              "api-ci.yml",
              "ml-service-ci.yml",
              "android-ci.yml",
              "android-ui-test.yml",
              "android-mobsfscan.yml"
            ];

            for (const wf of workflows) {
              core.info(`Dispatching ${wf} on develop`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf,
                ref: "develop"
              });
            }

