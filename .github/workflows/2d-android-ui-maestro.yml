name: 2d) Android UI - Maestro

on:
  workflow_dispatch:
  schedule:
    - cron: "42 16 * * *"
    - cron: "42 22 * * *"
    - cron: "42 4 * * *"
    - cron: "42 10 * * *"
  workflow_run:
    workflows: ["2a) Android CI"]
    types:
      - completed

jobs:
  ui-test:
    continue-on-error: true
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    defaults:
      run:
        working-directory: ./android

    strategy:
      matrix:
        api-level: [29]
        target: [default]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug

      - name: Install required libraries for emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 libxcb-xinerama0 libx11-6 libx11-xcb1

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro Flows
        uses: reactivecircus/android-emulator-runner@v2.35.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: Nexus 6
          script: |
            cd "$GITHUB_WORKSPACE"
            # 1. Setup Directories
            echo "--- Debug: Raw flow.yaml inspection ---"
            cat -A $GITHUB_WORKSPACE/android/.maestro/flow.yaml
            mkdir -p "$GITHUB_WORKSPACE/maestro-report"
            mkdir -p "$GITHUB_WORKSPACE/.maestro/recordings"
            mkdir -p "$GITHUB_WORKSPACE/.maestro/screenshots"

            # Wait for emulator + stabilize adb
            adb kill-server || true
            adb start-server
            adb wait-for-device
            adb devices
            
            # 2. Install the APK
            adb install "$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"

            # 3. Run Test (Generates JUnit XML)
            echo "Running Maestro Test..."
            maestro test $GITHUB_WORKSPACE/android/.maestro/flow.yaml --format junit --output "$GITHUB_WORKSPACE/maestro-report/report.xml" || touch "$GITHUB_WORKSPACE/.maestro/test_failed"

            # 4. Run Record (LOCAL MODE) - Generates overlaid MP4 automatically
            echo "Recording Video..."
            maestro record --local $GITHUB_WORKSPACE/android/.maestro/flow.yaml

            # Move the generated MP4 to desired location
            generated_mp4=$(find "$GITHUB_WORKSPACE" -maxdepth 1 -name "*.mp4" -type f | head -n 1)
            if [ -n "$generated_mp4" ]; then
              mv "$generated_mp4" "$GITHUB_WORKSPACE/.maestro/recordings/flow.mp4"
              echo "Video saved to .maestro/recordings/flow.mp4"
            else
              echo "Warning: No MP4 generated (flow might be too long or failed early)"
            fi

            # 5. Fail the job if the test failed
            if [ -f "$GITHUB_WORKSPACE/.maestro/test_failed" ]; then
              echo "Maestro tests failed!"
              exit 1
            fi

