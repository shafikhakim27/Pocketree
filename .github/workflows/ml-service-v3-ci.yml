name: 4e) ML CI (v3 Azure)

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"
  push:
    branches: ["main", "develop"]
    paths:
      - 'ml-service-v3/**'
      - '.github/workflows/ml-service-v3-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  SKIP_SNYK_SARIF: "false"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-service-v3/requirements.txt -r ml-service-v3/requirements-dev.txt

      - name: EditorConfig Check
        run: |
          curl -fL -sSLo ec.tar.gz https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v2.7.3/ec-linux-amd64.tar.gz
          file ec.tar.gz
          tar -xzf ec.tar.gz
          ./bin/ec -disable-indent-size -exclude ".git/**" -exclude ".venv/**" -exclude "ml-service-v3/.venv/**" ml-service-v3

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check ml-service-v3 --output-format json --output-file ruff-report.json

      - name: Type Check (mypy)
        run: |
          pip install mypy
          mypy --config-file ml-service-v3/mypy.ini ml-service-v3

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-v3-ruff-report
          path: ${{ github.workspace }}/ruff-report.json

      - name: Run ML Service Tests
        run: |
          pytest ml-service-v3/tests --junitxml=ml-service-v3-test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-service-v3-test-results
          path: ${{ github.workspace }}/ml-service-v3-test-results.xml

      - name: Build Summary
        if: always()
        run: |
          echo "ML Service v3 Tests: Completed" >> "$GITHUB_STEP_SUMMARY"

  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Snyk Python Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=ml-service-v3/requirements.txt --severity-threshold=high --skip-unresolved --json-file-output=ml-service-v3-snyk.json --sarif-file-output=ml-service-v3-snyk.sarif

      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r ml-service-v3/ -lll -iii -f json -o bandit-report.json

      - name: Check Snyk SARIF
        if: always()
        run: |
          if [ ! -s ml-service-v3-snyk.sarif ]; then
            echo "SKIP_SNYK_SARIF=true" >> $GITHUB_ENV
            echo "Snyk SARIF missing or empty, skipping upload."
          fi

      - name: Upload Snyk SARIF
        if: always() && env.SKIP_SNYK_SARIF != 'true'
        uses: github/codeql-action/upload-sarif@v4.31.10
        with:
          sarif_file: ml-service-v3-snyk.sarif

      - name: Upload Snyk Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-v3-snyk-report
          path: |
            ${{ github.workspace }}/ml-service-v3-snyk.json
            ${{ github.workspace }}/ml-service-v3-snyk.sarif

      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-v3-bandit-report
          path: ${{ github.workspace }}/bandit-report.json

      - name: Security Summary
        if: always()
        run: |
          echo "ML Service v3 Security Scans: Completed" >> $GITHUB_STEP_SUMMARY
