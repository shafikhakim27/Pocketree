name: 2b) Android Mobsfscan - SAST

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"

jobs:
  mobsf-scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Install MobSF Scanner
        run: |
          python -m pip install --upgrade pip
          pip install mobsfscan

      - name: Run MobSF Scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/mobsf"
          mobsfscan .. > "$GITHUB_WORKSPACE/mobsf/mobsfscan.txt" || true
          python - <<'PY'
          import json
          from pathlib import Path
          import re, os

          out_dir = Path(os.environ["GITHUB_WORKSPACE"]) / "mobsf"
          out_dir.mkdir(parents=True, exist_ok=True)
          report = out_dir / "mobsfscan.txt"
          counts = {}
          if report.exists():
            text = report.read_text(encoding="utf-8", errors="ignore")
            for match in re.finditer(r"Severity:\s*([A-Za-z]+)", text):
              sev = match.group(1).upper()
              counts[sev] = counts.get(sev, 0) + 1
          out = {
            "summary": "MobSF Scan",
            "total": sum(counts.values()),
            "by_severity": counts
          }
          (out_dir / "mobsfscan.json").write_text(json.dumps(out, indent=2), encoding="utf-8")
          PY

      - name: Upload MobSF Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: android-mobsf-report
          path: |
            ${{ github.workspace }}/mobsf/mobsfscan.json
            ${{ github.workspace }}/mobsf/mobsfscan.txt

      - name: Relaxed Scan Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import os

          out_dir = Path(os.environ["GITHUB_WORKSPACE"]) / "mobsf"
          report = out_dir / "mobsfscan.json"
          errors = 0
          warnings = 0
          details = []
          if report.exists():
            data = json.loads(report.read_text(encoding="utf-8", errors="ignore"))
            counts = {k.upper(): v for k, v in (data.get("by_severity") or {}).items()}
            errors = counts.get("CRITICAL", 0) + counts.get("HIGH", 0)
            warnings = counts.get("MEDIUM", 0) + counts.get("LOW", 0)
            details.append(
              "mobsf critical={0} high={1} medium={2} low={3}".format(
                counts.get("CRITICAL", 0),
                counts.get("HIGH", 0),
                counts.get("MEDIUM", 0),
                counts.get("LOW", 0)
              )
            )
          else:
            details.append("mobsf report missing")
          out = out_dir / "relaxed-checks-mobsf.txt"
          suggestions = []
          if errors or warnings:
            suggestions.append("Review MobSF findings and fix high/critical items.")
          else:
            suggestions.append("No action needed.")
          out.write_text(
            "errors={0} warnings={1}\n{2}\nSuggested actions: {3}\n".format(
              errors, warnings, "\n".join(details), ", ".join(suggestions)
            ),
            encoding="utf-8"
          )
          md = out_dir / "relaxed-checks-mobsf.md"
          md.write_text(
            "\n".join([
              "## Android MobSF (relaxed)",
              "",
              "| Metric | Count |",
              "| --- | ---: |",
              f"| Errors | {errors} |",
              f"| Warnings | {warnings} |",
              "",
              "**Suggested actions**",
              f"- {suggestions[0]}",
              "",
              "Details:",
              *[f"- {d}" for d in details],
              ""
            ]),
            encoding="utf-8"
          )
          html = out_dir / "relaxed-checks-mobsf.html"
          html_lines = [
            "<!doctype html>",
            "<html lang=\"en\">",
            "  <head>",
            "    <meta charset=\"utf-8\" />",
            "    <title>Android MobSF (relaxed)</title>",
            "    <style>",
            "      body {{ font-family: Arial, sans-serif; margin: 24px; }}",
            "      table {{ border-collapse: collapse; width: 360px; }}",
            "      th, td {{ border: 1px solid #ddd; padding: 8px; text-align: left; }}",
            "      th {{ background: #f3f4f6; }}",
            "      .section {{ margin-top: 16px; }}",
            "      ul {{ margin: 6px 0 0 18px; }}",
            "    </style>",
            "  </head>",
            "  <body>",
            "    <h2>Android MobSF (relaxed)</h2>",
            "    <table>",
            "      <tr><th>Metric</th><th>Count</th></tr>",
            f"      <tr><td>Errors</td><td>{errors}</td></tr>",
            f"      <tr><td>Warnings</td><td>{warnings}</td></tr>",
            "    </table>",
            "    <div class=\"section\"><strong>Suggested actions</strong>",
            f"      <ul><li>{suggestions[0]}</li></ul>",
            "    </div>",
            "    <div class=\"section\"><strong>Details</strong>",
            "      <ul>",
            *[f"<li>{d}</li>" for d in details],
            "      </ul>",
            "    </div>",
            "  </body>",
            "</html>"
          ]
          html.write_text("\\n".join(html_lines), encoding="utf-8")
          PY
          cat "$GITHUB_WORKSPACE/mobsf/relaxed-checks-mobsf.txt" >> $GITHUB_STEP_SUMMARY
          cat "$GITHUB_WORKSPACE/mobsf/relaxed-checks-mobsf.md" >> $GITHUB_STEP_SUMMARY

      - name: Upload Relaxed Scan Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: android-mobsf-relaxed-checks
          path: |
            ${{ github.workspace }}/mobsf/relaxed-checks-mobsf.txt
            ${{ github.workspace }}/mobsf/relaxed-checks-mobsf.md
            ${{ github.workspace }}/mobsf/relaxed-checks-mobsf.html

      - name: Build Relaxed Dashboard
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          import os

          base = Path(os.environ["GITHUB_WORKSPACE"]) / "mobsf"
          files = sorted(base.glob("relaxed-checks*.txt"))
          rows = []
          for f in files:
            lines = f.read_text(encoding="utf-8", errors="ignore").splitlines()
            header = lines[0] if lines else ""
            errors = warnings = "0"
            if header.startswith("errors="):
              parts = dict(p.split("=") for p in header.split() if "=" in p)
              errors = parts.get("errors", "0")
              warnings = parts.get("warnings", "0")
            actions = ""
            for line in lines:
              if line.lower().startswith("suggested actions:"):
                actions = line.split(":", 1)[1].strip()
                break
            rows.append((f.name, errors, warnings, actions))

          html_out = base / "relaxed-dashboard.html"
          html_out.write_text(
            "<!doctype html><html><head><meta charset='utf-8'/>"
            "<title>Relaxed Checks Dashboard</title>"
            "<style>body{font-family:Arial,sans-serif;margin:24px;}table{border-collapse:collapse;width:100%;}"
            "th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#f3f4f6;}</style>"
            "</head><body><h2>Relaxed Checks Dashboard</h2>"
            "<table><tr><th>Check</th><th>Errors</th><th>Warnings</th><th>Suggested actions</th></tr>" +
            "".join(
              f"<tr><td>{html.escape(name)}</td><td>{html.escape(err)}</td><td>{html.escape(warn)}</td>"
              f"<td>{html.escape(act)}</td></tr>"
              for name, err, warn, act in rows
            ) +
            "</table></body></html>",
            encoding="utf-8"
          )
          PY

      - name: Upload Relaxed Dashboard
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: android-mobsf-relaxed-dashboard
          path: ${{ github.workspace }}/mobsf/relaxed-dashboard.html

      - name: Build Summary
        if: always()
        run: |
          cat > "$GITHUB_WORKSPACE/summary.json" <<'JSON'
          {
            "summary": "Android MobSF Scan",
            "mobsf_scan": "Completed"
          }
          JSON
          cat > "$GITHUB_WORKSPACE/summary.txt" <<'TXT'
          Android MobSF Scan
          MobSF Scan: Completed
          TXT
          cat "$GITHUB_WORKSPACE/summary.txt" >> $GITHUB_STEP_SUMMARY

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: android-mobsfscan-summary
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

