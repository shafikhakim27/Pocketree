name: 2b) Android Mobsfscan - SAST

on:
  workflow_dispatch:
  schedule:
    - cron: "24 16 * * *"
    - cron: "24 22 * * *"
    - cron: "24 4 * * *"
    - cron: "24 10 * * *"
jobs:
  mobsf-scan:
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Install MobSF Scanner
        run: |
          python -m pip install --upgrade pip
          pip install mobsfscan

      - name: Run MobSF Scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/mobsf"
          mobsfscan .. > "$GITHUB_WORKSPACE/mobsf/mobsfscan.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          import re, os

          out_dir = Path(os.environ["GITHUB_WORKSPACE"]) / "mobsf"
          out_dir.mkdir(parents=True, exist_ok=True)
          report = out_dir / "mobsfscan.txt"
          counts = {}
          if report.exists():
            text = report.read_text(encoding="utf-8", errors="ignore")
            for match in re.finditer(r"Severity:\s*([A-Za-z]+)", text):
              sev = match.group(1).upper()
              counts[sev] = counts.get(sev, 0) + 1
          out = {
            "summary": "MobSF Scan",
            "total": sum(counts.values()),
            "by_severity": counts
          }
          (out_dir / "mobsfscan.json").write_text(json.dumps(out, indent=2), encoding="utf-8")
          if counts.get("CRITICAL", 0) + counts.get("HIGH", 0) > 0:
            raise SystemExit("MobSF Scan failed: high/critical findings present.")
          PY

