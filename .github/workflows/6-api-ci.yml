name: 6. API CI (Build, Test, Scan, SAST)

on:
  workflow_dispatch:
  schedule:
    - cron: "10 20 * * *"
  push:
    branches: ["main", "develop"]
    paths:
      - 'api/**'
      - '.github/workflows/6-api-ci.yml'
permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/pocketree-api
  AZURE_WEBAPP_NAME: pocketree-api

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: 9.0.x

      - name: Restore Dependencies
        run: dotnet restore api/api.sln

      - name: Lint (dotnet format)
        run: |
          dotnet tool install --global dotnet-format
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
          dotnet format api/api.sln --verify-no-changes --report format-report.json

      - name: Snyk Security Scan
        uses: snyk/actions/dotnet@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=api/api.sln --severity-threshold=high --skip-unresolved --json-file-output=api-snyk.json --sarif-file-output=api-snyk.sarif

      - name: Ensure API CI Scan Files Exist
        if: always()
        run: |
          set -euo pipefail
          [ -f api-snyk.json ] || echo '{"note":"snyk report missing"}' > api-snyk.json
          [ -f api-snyk.sarif ] || echo '{"version":"2.1.0","runs":[]}' > api-snyk.sarif

      - name: Build Solution
        run: dotnet build api/api.sln --no-restore --configuration Release

      - name: Publish Test Project
        run: dotnet publish api/Pocketree.Api.Tests/Pocketree.Api.Tests.csproj --configuration Release --output ./test-artifacts
      
      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: test-artifacts
          path: ${{ github.workspace }}/test-artifacts/

      - name: Upload API CI Scan Reports
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: api-ci-scan-reports
          path: |
            ${{ github.workspace }}/format-report.json
            ${{ github.workspace }}/api-snyk.json
            ${{ github.workspace }}/api-snyk.sarif

      - name: Upload Snyk SARIF (API)
        if: always()
        uses: github/codeql-action/upload-sarif@v4.31.10
        with:
          sarif_file: api-snyk.sarif

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - name: Download Test Artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          name: test-artifacts
          path: ./test-artifacts

      - name: Run Unit Tests
        run: dotnet test ./test-artifacts/Pocketree.Api.Tests.dll --logger "trx;logfilename=unit_test_results.trx" --collect:"XPlat Code Coverage" --filter "FullyQualifiedName!~Pocketree.Api.Tests.Integration"

      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Start services
        run: docker compose -f "docker compose.yml" up -d pocketree-db

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if docker compose -f "docker compose.yml" exec -T pocketree-db env MYSQL_PWD=password mysqladmin ping -h "localhost" -u "root" --silent; then
              echo "MySQL is ready."
              exit 0
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL did not become ready in time."
          exit 1

      - name: Download Test Artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          name: test-artifacts
          path: ./test-artifacts

      - name: Run Integration Tests
        env:
          ConnectionStrings__DefaultConnection: Server=localhost;Port=3306;Database=pocketree;User=root;Password=password
          USE_IN_MEMORY_DATABASE: false
        run: dotnet test ./test-artifacts/Pocketree.Api.Tests.dll --logger "trx;logfilename=integration_test_results.trx" --collect:"XPlat Code Coverage" --filter "FullyQualifiedName~Pocketree.Api.Tests.Integration"

      - name: Stop services
        if: always()
        run: docker compose -f "docker compose.yml" down

      - name: Download Artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: ./artifacts

