name: 1a) Code Quality

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  android-quality:
    continue-on-error: true
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Summarize Lint Severities
        if: always()
        run: |
          report="${{ github.workspace }}/android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path(r"""${{ github.workspace }}/android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt""")
          data = {"summary": "Android Lint Summary"}
          if report.exists():
            text = report.read_text(encoding="utf-8", errors="ignore")
            data.update({
              "critical": text.lower().count("severity: fatal"),
              "high": text.lower().count("severity: error"),
              "medium": text.lower().count("severity: warning"),
              "low": text.lower().count("severity: information")
            })
          else:
            data["error"] = "Lint report not found."
          Path("summary.json").write_text(json.dumps(data, indent=2), encoding="utf-8")
          lines = [
            "Android Lint Summary",
            f"Critical: {data.get('critical', 0)}",
            f"High: {data.get('high', 0)}",
            f"Medium: {data.get('medium', 0)}",
            f"Low: {data.get('low', 0)}",
          ]
          if data.get("error"):
            lines.append(f"Error: {data['error']}")
          Path("summary.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat summary.txt >> $GITHUB_STEP_SUMMARY

      - name: Quality Gate (Strict)
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = {}
          summary = Path("summary.json")
          if summary.exists():
            data = json.loads(summary.read_text(encoding="utf-8", errors="ignore"))
          critical = int(data.get("critical", 0) or 0)
          high = int(data.get("high", 0) or 0)
          if critical or high:
            raise SystemExit(1)
          PY

      - name: Relaxed Lint Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          errors = 0
          warnings = 0
          details = []

          summary = Path("summary.json")
          if summary.exists():
            data = json.loads(summary.read_text(encoding="utf-8", errors="ignore"))
            errors = int(data.get("critical", 0)) + int(data.get("high", 0))
            warnings = int(data.get("medium", 0)) + int(data.get("low", 0))
            details.append(
              f"android-lint critical={data.get('critical', 0)} "
              f"high={data.get('high', 0)} medium={data.get('medium', 0)} "
              f"low={data.get('low', 0)}"
            )
          else:
            details.append("android-lint summary missing")

          out = Path("relaxed-checks-android.txt")
          suggestions = []
          if errors or warnings:
            suggestions.append("Run ./gradlew lintDebug and fix reported issues.")
          else:
            suggestions.append("No action needed.")
          out.write_text(
            "errors={0} warnings={1}\n{2}\nSuggested actions: {3}\n".format(
              errors, warnings, "\n".join(details), ", ".join(suggestions)
            ),
            encoding="utf-8"
          )
          md = Path("relaxed-checks-android.md")
          md.write_text(
            "\n".join([
              "## Android Lint (relaxed)",
              "",
              "| Metric | Count |",
              "| --- | ---: |",
              f"| Errors | {errors} |",
              f"| Warnings | {warnings} |",
              "",
              "**Suggested actions**",
              f"- {suggestions[0]}",
              "",
              "Details:",
              *[f"- {d}" for d in details],
              ""
            ]),
            encoding="utf-8"
          )
          html = Path("relaxed-checks-android.html")
          html.write_text(
            "\n".join([
              "<!doctype html>",
              "<html lang=\"en\">",
              "  <head>",
              "    <meta charset=\"utf-8\" />",
              "    <title>Android Lint (strict)</title>",
              "    <style>",
              "      body {{ font-family: Arial, sans-serif; margin: 24px; }}",
              "      table {{ border-collapse: collapse; width: 360px; }}",
              "      th, td {{ border: 1px solid #ddd; padding: 8px; text-align: left; }}",
              "      th {{ background: #f3f4f6; }}",
              "      .ok {{ color: #0f7b0f; font-weight: 600; }}",
              "      .fail {{ color: #b00020; font-weight: 600; }}",
              "      .section {{ margin-top: 16px; }}",
              "      ul {{ margin: 6px 0 0 18px; }}",
              "    </style>",
              "  </head>",
              "  <body>",
              "    <h2>Android Lint (strict)</h2>",
              f"    <p>Status: <span class={'\"fail\"' if (errors or warnings) else '\"ok\"'}>{'FAIL' if (errors or warnings) else 'PASS'}</span></p>",
              "    <table>",
              "      <tr><th>Metric</th><th>Count</th></tr>",
              "      <tr><td>Errors</td><td>{errors}</td></tr>",
              "      <tr><td>Warnings</td><td>{warnings}</td></tr>",
              "    </table>",
              "    <div class=\"section\"><strong>Suggested actions</strong>",
              "      <ul><li>{suggestions[0]}</li></ul>",
              "    </div>",
              "    <div class=\"section\"><strong>Details</strong>",
              "      <ul>",
              "        {''.join(f'<li>{d}</li>' for d in details)}",
              "      </ul>",
              "    </div>",
              "  </body>",
              "</html>"
            ]),
            encoding="utf-8"
          )
          PY
          cat relaxed-checks-android.txt >> $GITHUB_STEP_SUMMARY
          cat relaxed-checks-android.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: android-lint-report
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: android-lint-summary
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

      - name: Upload Relaxed Lint Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: android-relaxed-checks
          path: |
            ${{ github.workspace }}/relaxed-checks-android.txt
            ${{ github.workspace }}/relaxed-checks-android.md
            ${{ github.workspace }}/relaxed-checks-android.html

      - name: Suggested Improvements (Author)
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          def get_author():
            try:
              return subprocess.check_output(
                ["git", "log", "-1", "--pretty=format:%an"],
                text=True
              ).strip() or "Unknown"
            except Exception:
              return "Unknown"

          suggestions = []
          owners = {
            "mobile": ["@shirleytjy", "CHEN HAOTING"],
            "api": ["@shafikhakim27", "@gohwnyyhw"],
            "ml": ["@wcyapplemist", "@fresfrida"]
          }

          # Android lint summary (code style)
          summary = Path("summary.json")
          if summary.exists():
            data = json.loads(summary.read_text(encoding="utf-8", errors="ignore"))
            critical = int(data.get("critical", 0))
            high = int(data.get("high", 0))
            medium = int(data.get("medium", 0))
            if critical or high:
              suggestions.append(("Fix Android lint critical/high issues (lintDebug) before merging.", "mobile"))
            elif medium:
              suggestions.append(("Address Android lint warnings to reduce noisy UI regressions.", "mobile"))

          # Ruff (if present)
          ruff = Path("ruff-report.json")
          if ruff.exists():
            try:
              items = json.loads(ruff.read_text(encoding="utf-8", errors="ignore"))
              if isinstance(items, list) and items:
                suggestions.append(("Clean up Python style issues flagged by ruff.", "ml"))
            except Exception:
              pass

          # Mypy (if present)
          mypy = Path("mypy-report.txt")
          if mypy.exists() and mypy.read_text(encoding="utf-8", errors="ignore").strip():
            suggestions.append(("Resolve mypy type errors for safer ML/service changes.", "ml"))

          # Fallback if no signals found
          if not suggestions:
            suggestions.append(("No code-style improvements detected in this run.", "api"))

          # Limit to 3
          suggestions = suggestions[:3]

          author = get_author()
          out = Path("suggested-improvements.md")
          lines = [
            "## Suggested Improvements",
            f"Author: **{author}**",
            "",
            "| # | Suggestion | Owner(s) |",
            "| --- | --- | --- |",
          ]
          for i, (s, team) in enumerate(suggestions, 1):
            owner_list = owners.get(team, [])
            owner_text = ", ".join(owner_list) if owner_list else "Unassigned"
            lines.append(f"| {i} | {s} | {owner_text} |")
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat suggested-improvements.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Suggested Improvements
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: code-quality-suggested-improvements
          path: ${{ github.workspace }}/suggested-improvements.md

      - name: Build Relaxed Dashboard
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import html

          files = sorted(Path(".").glob("relaxed-checks*.txt"))
          rows = []
          for f in files:
            lines = f.read_text(encoding="utf-8", errors="ignore").splitlines()
            header = lines[0] if lines else ""
            errors = warnings = "0"
            if header.startswith("errors="):
              parts = dict(p.split("=") for p in header.split() if "=" in p)
              errors = parts.get("errors", "0")
              warnings = parts.get("warnings", "0")
            actions = ""
            for line in lines:
              if line.lower().startswith("suggested actions:"):
                actions = line.split(":", 1)[1].strip()
                break
            rows.append((f.name, errors, warnings, actions))

          html_out = Path("relaxed-dashboard.html")
          html_out.write_text(
            "<!doctype html><html><head><meta charset='utf-8'/>"
            "<title>Relaxed Checks Dashboard</title>"
            "<style>body{font-family:Arial,sans-serif;margin:24px;}table{border-collapse:collapse;width:100%;}"
            "th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#f3f4f6;}</style>"
            "</head><body><h2>Relaxed Checks Dashboard</h2>"
            "<table><tr><th>Check</th><th>Errors</th><th>Warnings</th><th>Suggested actions</th></tr>" +
            "".join(
              f"<tr><td>{html.escape(name)}</td><td>{html.escape(err)}</td><td>{html.escape(warn)}</td>"
              f"<td>{html.escape(act)}</td></tr>"
              for name, err, warn, act in rows
            ) +
            "</table></body></html>",
            encoding="utf-8"
          )
          PY

      - name: Upload Relaxed Dashboard
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: android-relaxed-dashboard
          path: ${{ github.workspace }}/relaxed-dashboard.html

  ml-service-quality:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: TruffleHog Scan
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          path: .
          base: ${{ github.event.before }}
          head: ${{ github.sha }}

      - name: Lint Checks (pre-commit equivalent)
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          import yaml

          root = Path(".").resolve()
          exclude_dirs = {".git", ".venv", "node_modules", "bin", "obj", ".idea", ".vscode"}

          def should_skip(path: Path) -> bool:
            for part in path.parts:
              if part in exclude_dirs:
                return True
            return False

          files = [p for p in root.rglob("*") if p.is_file() and not should_skip(p)]

          # check-merge-conflict
          conflict_hits = []
          for p in files:
            try:
              text = p.read_text(encoding="utf-8", errors="ignore")
            except Exception:
              continue
            if any(token in text for token in ("<<<<<<<", "=======", ">>>>>>>")):
              conflict_hits.append(str(p))

          # trailing-whitespace + end-of-file-fixer checks
          trailing_ws = []
          no_final_newline = []
          for p in files:
            try:
              data = p.read_bytes()
            except Exception:
              continue
            if not data:
              continue
            try:
              text = data.decode("utf-8", errors="ignore")
            except Exception:
              continue
            lines = text.splitlines()
            if any(line.rstrip("\r\n") != line.rstrip("\r\n").rstrip() for line in lines):
              trailing_ws.append(str(p))
            if not text.endswith("\n"):
              no_final_newline.append(str(p))

          # check-yaml + check-json
          yaml_errors = []
          json_errors = []
          for p in files:
            if p.suffix in {".yaml", ".yml"}:
              try:
                yaml.safe_load(p.read_text(encoding="utf-8", errors="ignore"))
              except Exception as e:
                yaml_errors.append(f"{p}: {e}")
            elif p.suffix == ".json":
              try:
                json.loads(p.read_text(encoding="utf-8", errors="ignore"))
              except Exception as e:
                json_errors.append(f"{p}: {e}")

          errors = []
          if conflict_hits:
            errors.append("Merge conflict markers found:\n" + "\n".join(conflict_hits))
          if trailing_ws:
            errors.append("Trailing whitespace found:\n" + "\n".join(trailing_ws))
          if no_final_newline:
            errors.append("Missing final newline:\n" + "\n".join(no_final_newline))
          if yaml_errors:
            errors.append("YAML parse errors:\n" + "\n".join(yaml_errors))
          if json_errors:
            errors.append("JSON parse errors:\n" + "\n".join(json_errors))

          if errors:
            print("\n\n".join(errors))
            sys.exit(1)
          print("Lint checks passed.")
          PY

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-service/requirements.txt -r ml-service/requirements-dev.txt

      - name: Run ML Service Tests
        run: |
          pytest ml-service/tests --junitxml=ml-service-test-results.xml

      - name: Run ML Service v2 Tests
        run: |
          pytest ml-service-v2/tests --junitxml=ml-service-v2-test-results.xml

      - name: Run ML Service v3 Tests
        run: |
          pytest ml-service-v3/tests --junitxml=ml-service-v3-test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-service-test-results
          path: |
            ${{ github.workspace }}/ml-service-test-results.xml
            ${{ github.workspace }}/ml-service-v2-test-results.xml
            ${{ github.workspace }}/ml-service-v3-test-results.xml

      - name: Build Summary
        if: always()
        run: |
          cat > summary.json <<'JSON'
          {
            "summary": "ML Service Tests",
            "status": "Completed"
          }
          JSON
          cat > summary.txt <<'TXT'
          ML Service Tests
          Status: Completed
          TXT
          cat summary.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-service-quality-summary
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

  codeql:
    continue-on-error: true
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'java-kotlin', 'python' ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.31.10
        with:
          languages: ${{ matrix.language }}

      - name: Build (C#)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: 9.0.x

      - name: Compile (C#)
        if: matrix.language == 'csharp'
        run: dotnet build api/api.sln --configuration Release

      - name: Build (Java/Kotlin)
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Compile (Java/Kotlin)
        if: matrix.language == 'java-kotlin'
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Autobuild (Python)
        if: matrix.language == 'python'
        uses: github/codeql-action/autobuild@v4.31.10

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.31.10
        with:
          output: codeql-results

      - name: Upload CodeQL Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: codeql-sarif-${{ matrix.language }}
          path: ${{ github.workspace }}/codeql-results/**/*.sarif

      - name: Step Summary
        if: always()
        run: |
          echo "CodeQL (${{ matrix.language }}): Completed" >> $GITHUB_STEP_SUMMARY

