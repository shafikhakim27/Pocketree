name: 4g) ML CD (v3 Azure)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["4e) ML CI (v3 Azure)"]
    types:
      - completed

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/pocketree-ml-v3
  AZURE_WEBAPP_NAME: pocketree-ml-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: ml-service-v3
          file: ml-service-v3/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Free Disk Space
        run: |
          docker system prune -af
          docker builder prune -af

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '0'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Build Trivy Text Report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path("trivy-report.json")
          out = Path("trivy-report.txt")
          if not src.exists():
            out.write_text("Trivy report not found.\n", encoding="utf-8")
            raise SystemExit(0)
          data = json.loads(src.read_text(encoding="utf-8", errors="ignore") or "{}")
          results = data.get("Results", [])
          lines = ["Trivy Report", f"Targets: {len(results)}"]
          for r in results:
            target = r.get("Target", "unknown")
            vulns = r.get("Vulnerabilities", []) or []
            lines.append(f"- {target}: {len(vulns)} findings")
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Relaxed Trivy Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          errors = 0
          warnings = 0
          details = []

          src = Path("trivy-report.json")
          if src.exists():
            data = json.loads(src.read_text(encoding="utf-8", errors="ignore") or "{}")
            results = data.get("Results", []) or []
            sev_counts = {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0}
            for r in results:
              for v in (r.get("Vulnerabilities") or []):
                sev = str(v.get("Severity", "")).upper()
                if sev in sev_counts:
                  sev_counts[sev] += 1
            errors = sev_counts["CRITICAL"] + sev_counts["HIGH"]
            warnings = sev_counts["MEDIUM"] + sev_counts["LOW"]
            details.append(
              "trivy critical={CRITICAL} high={HIGH} medium={MEDIUM} low={LOW}".format(**sev_counts)
            )
          else:
            details.append("trivy report missing")

          out = Path("relaxed-checks-trivy.txt")
          suggestions = []
          if errors or warnings:
            suggestions.append("Review Trivy findings and patch base image/deps.")
          else:
            suggestions.append("No action needed.")
          out.write_text(
            "errors={0} warnings={1}\n{2}\nSuggested actions: {3}\n".format(
              errors, warnings, "\n".join(details), ", ".join(suggestions)
            ),
            encoding="utf-8"
          )
          md = Path("relaxed-checks-trivy.md")
          md.write_text(
            "\n".join([
              "## ML v3 Trivy (relaxed)",
              "",
              "| Metric | Count |",
              "| --- | ---: |",
              f"| Errors | {errors} |",
              f"| Warnings | {warnings} |",
              "",
              "**Suggested actions**",
              f"- {suggestions[0]}",
              "",
              "Details:",
              *[f"- {d}" for d in details],
              ""
            ]),
            encoding="utf-8"
          )
          html = Path("relaxed-checks-trivy.html")
          html.write_text(
            f"""<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ML v3 Trivy (relaxed)</title>
    <style>
      body {{ font-family: Arial, sans-serif; margin: 24px; }}
      table {{ border-collapse: collapse; width: 360px; }}
      th, td {{ border: 1px solid #ddd; padding: 8px; text-align: left; }}
      th {{ background: #f3f4f6; }}
      .section {{ margin-top: 16px; }}
      ul {{ margin: 6px 0 0 18px; }}
    </style>
  </head>
  <body>
    <h2>ML v3 Trivy (relaxed)</h2>
    <table>
      <tr><th>Metric</th><th>Count</th></tr>
      <tr><td>Errors</td><td>{errors}</td></tr>
      <tr><td>Warnings</td><td>{warnings}</td></tr>
    </table>
    <div class="section"><strong>Suggested actions</strong>
      <ul><li>{suggestions[0]}</li></ul>
    </div>
    <div class="section"><strong>Details</strong>
      <ul>
        {''.join(f'<li>{d}</li>' for d in details)}
      </ul>
    </div>
  </body>
</html>""",
            encoding="utf-8"
          )
          PY
          cat relaxed-checks-trivy.txt >> $GITHUB_STEP_SUMMARY
          cat relaxed-checks-trivy.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: trivy-report-ml-v3
          path: |
            ${{ github.workspace }}/trivy-report.json
            ${{ github.workspace }}/trivy-report.txt

      - name: Upload Relaxed Trivy Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-v3-relaxed-checks-trivy
          path: |
            ${{ github.workspace }}/relaxed-checks-trivy.txt
            ${{ github.workspace }}/relaxed-checks-trivy.md
            ${{ github.workspace }}/relaxed-checks-trivy.html

      - name: Build Relaxed Dashboard
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import html

          files = sorted(Path(".").glob("relaxed-checks*.txt"))
          rows = []
          for f in files:
            lines = f.read_text(encoding="utf-8", errors="ignore").splitlines()
            header = lines[0] if lines else ""
            errors = warnings = "0"
            if header.startswith("errors="):
              parts = dict(p.split("=") for p in header.split() if "=" in p)
              errors = parts.get("errors", "0")
              warnings = parts.get("warnings", "0")
            actions = ""
            for line in lines:
              if line.lower().startswith("suggested actions:"):
                actions = line.split(":", 1)[1].strip()
                break
            rows.append((f.name, errors, warnings, actions))

          html_out = Path("relaxed-dashboard.html")
          html_out.write_text(
            "<!doctype html><html><head><meta charset='utf-8'/>"
            "<title>Relaxed Checks Dashboard</title>"
            "<style>body{font-family:Arial,sans-serif;margin:24px;}table{border-collapse:collapse;width:100%;}"
            "th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#f3f4f6;}</style>"
            "</head><body><h2>Relaxed Checks Dashboard</h2>"
            "<table><tr><th>Check</th><th>Errors</th><th>Warnings</th><th>Suggested actions</th></tr>" +
            "".join(
              f"<tr><td>{html.escape(name)}</td><td>{html.escape(err)}</td><td>{html.escape(warn)}</td>"
              f"<td>{html.escape(act)}</td></tr>"
              for name, err, warn, act in rows
            ) +
            "</table></body></html>",
            encoding="utf-8"
          )
          PY

      - name: Upload Relaxed Dashboard
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-v3-relaxed-dashboard
          path: ${{ github.workspace }}/relaxed-dashboard.html

      - name: Azure Login
        uses: azure/login@v2.3.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2.2.17
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: '${{ env.IMAGE_NAME }}:sha-${{ github.sha }}'

      - name: Step Summary
        if: always()
        run: |
          echo "ML v3 CD: Azure deploy completed" >> $GITHUB_STEP_SUMMARY
