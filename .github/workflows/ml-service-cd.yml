name: ML Service CD

on:
  push:
    branches: ["main"]
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service-cd.yml'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: pocketree-ml-service
  GCP_REGION: asia-southeast1
  AR_REPO: pocketree-ml
  IMAGE_NAME: pocketree-ml
  ENDPOINT_NAME: pocketree-ml-endpoint

jobs:
  build-and-deploy-ml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure Artifact Registry exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location "${{ env.GCP_REGION }}" || \
          gcloud artifacts repositories create "${{ env.AR_REPO }}" \
            --repository-format=docker \
            --location "${{ env.GCP_REGION }}" \
            --description="Pocketree ML images"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push ML Docker image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          docker build -f ml-service/Dockerfile -t "$IMAGE_URI" ml-service
          docker push "$IMAGE_URI"

      - name: Upload model to Vertex AI
        run: |
          set -euo pipefail
          MODEL_ID=$(gcloud ai models upload \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --display-name "${{ env.IMAGE_NAME }}" \
            --container-image-uri "$IMAGE_URI" \
            --container-ports 8080 \
            --container-predict-route /predict \
            --container-health-route /health \
            --format="value(name)")
          if [ -z "$MODEL_ID" ]; then
            echo "Model upload did not return a model ID."
            exit 1
          fi
          echo "MODEL_ID=$MODEL_ID" >> $GITHUB_ENV

      - name: Create endpoint if missing
        run: |
          set -euo pipefail
          ENDPOINT_ID=$(gcloud ai endpoints list \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --filter="displayName=${{ env.ENDPOINT_NAME }}" \
            --format="value(name)" | head -n 1)
          if [ -z "$ENDPOINT_ID" ]; then
            ENDPOINT_ID=$(gcloud ai endpoints create \
              --project "${{ env.GCP_PROJECT_ID }}" \
              --region "${{ env.GCP_REGION }}" \
              --display-name "${{ env.ENDPOINT_NAME }}" \
              --format="value(name)")
          fi
          if [ -z "$ENDPOINT_ID" ]; then
            echo "Endpoint create/list did not return an endpoint ID."
            exit 1
          fi
          echo "ENDPOINT_ID=$ENDPOINT_ID" >> $GITHUB_ENV

      - name: Deploy model to endpoint
        run: |
          set -euo pipefail
          echo "Deploying MODEL_ID=$MODEL_ID to ENDPOINT_ID=$ENDPOINT_ID"
          gcloud ai endpoints deploy-model "$ENDPOINT_ID" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --model "$MODEL_ID" \
            --display-name "${{ env.IMAGE_NAME }}-sha-${{ github.sha }}" \
            --machine-type "e2-standard-4" \
            --min-replica-count 1 \
            --max-replica-count 1 \
            --traffic-split=0=100
