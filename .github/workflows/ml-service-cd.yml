name: 4b) ML CD (Deploy -GCP)

on:
  workflow_run:
    workflows: ["4a) ML CI (Build, Test, Scan, SAST)"]
    types:
      - completed
  workflow_dispatch:

env:
  GCP_PROJECT_ID: pocketree-ml-service
  GCP_REGION: asia-southeast1
  AR_REPO: pocketree-ml
  IMAGE_NAME: pocketree-ml
  MODEL_DISPLAY_NAME: pocketree-ml
  ENDPOINT_DISPLAY_NAME: pocketree-ml-endpoint
  MACHINE_TYPE: n1-standard-4
  ACCELERATOR_TYPE: nvidia-tesla-t4
  ACCELERATOR_COUNT: "1"
  MIN_REPLICA_COUNT: "1"
  MAX_REPLICA_COUNT: "1"

jobs:
  build-and-deploy-ml:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Ensure Artifact Registry exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location "${{ env.GCP_REGION }}" || \
          gcloud artifacts repositories create "${{ env.AR_REPO }}" \
            --repository-format=docker \
            --location "${{ env.GCP_REGION }}" \
            --description="Pocketree ML images"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push ML Docker image
        id: build_image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          docker build -f ml-service/Dockerfile -t "$IMAGE_URI" ml-service
          docker push "$IMAGE_URI"

      - name: Free Disk Space
        run: |
          docker system prune -af
          docker builder prune -af

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build_image.outputs.image_uri }}
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Build Trivy Text Report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path("trivy-report.json")
          out = Path("trivy-report.txt")
          if not src.exists():
            out.write_text("Trivy report not found.\n", encoding="utf-8")
            raise SystemExit(0)
          data = json.loads(src.read_text(encoding="utf-8", errors="ignore") or "{}")
          results = data.get("Results", [])
          lines = ["Trivy Report", f"Targets: {len(results)}"]
          for r in results:
            target = r.get("Target", "unknown")
            vulns = r.get("Vulnerabilities", []) or []
            lines.append(f"- {target}: {len(vulns)} findings")
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: trivy-report
          path: |
            ${{ github.workspace }}/trivy-report.json
            ${{ github.workspace }}/trivy-report.txt

      - name: Upload Model to Vertex AI
        id: upload_model
        run: |
          set -euo pipefail
          MODEL_ID="$(gcloud ai models list \
            --region "${{ env.GCP_REGION }}" \
            --filter="display_name=${{ env.MODEL_DISPLAY_NAME }}" \
            --sort-by=~createTime \
            --limit=1 \
            --format="value(name)")"

          MODEL_ID="$(gcloud ai models upload \
            --region "${{ env.GCP_REGION }}" \
            --display-name "${{ env.MODEL_DISPLAY_NAME }}" \
            --container-image-uri "$IMAGE_URI" \
            --container-predict-route="/predict" \
            --container-health-route="/health" \
            --container-ports=8080 \
            --format="value(name)")"

          echo "MODEL_ID=$MODEL_ID" >> "$GITHUB_ENV"
          echo "model_id=$MODEL_ID" >> "$GITHUB_OUTPUT"

      - name: Ensure Vertex AI Endpoint exists
        id: ensure_endpoint
        run: |
          set -euo pipefail
          ENDPOINT_ID="$(gcloud ai endpoints list \
            --region "${{ env.GCP_REGION }}" \
            --filter="display_name=${{ env.ENDPOINT_DISPLAY_NAME }}" \
            --limit=1 \
            --format="value(name)")"

          if [ -z "$ENDPOINT_ID" ]; then
            ENDPOINT_ID="$(gcloud ai endpoints create \
              --region "${{ env.GCP_REGION }}" \
              --display-name "${{ env.ENDPOINT_DISPLAY_NAME }}" \
              --format="value(name)")"
          fi

          echo "ENDPOINT_ID=$ENDPOINT_ID" >> "$GITHUB_ENV"
          echo "endpoint_id=$ENDPOINT_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy Model to Vertex AI Endpoint
        run: |
          set -euo pipefail
          gcloud ai endpoints deploy-model "$ENDPOINT_ID" \
            --region "${{ env.GCP_REGION }}" \
            --model "$MODEL_ID" \
            --display-name "sha-${{ github.sha }}" \
            --machine-type "${{ env.MACHINE_TYPE }}" \
            --accelerator "type=${{ env.ACCELERATOR_TYPE }},count=${{ env.ACCELERATOR_COUNT }}" \
            --min-replica-count "${{ env.MIN_REPLICA_COUNT }}" \
            --max-replica-count "${{ env.MAX_REPLICA_COUNT }}" \
            --traffic-split "0=100"

