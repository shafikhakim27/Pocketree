name: ML Service CD

on:
  push:
    branches: ["main"]
    paths:
      - 'ml-service/**'
      - '.github/workflows/ml-service-cd.yml'
  workflow_dispatch:

env:
  GCP_PROJECT_ID: pocketree-ml-service
  GCP_REGION: asia-southeast1
  AR_REPO: pocketree-ml
  IMAGE_NAME: pocketree-ml
  SERVICE_NAME: pocketree-ml

jobs:
  build-and-deploy-ml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Ensure Artifact Registry exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location "${{ env.GCP_REGION }}" || \
          gcloud artifacts repositories create "${{ env.AR_REPO }}" \
            --repository-format=docker \
            --location "${{ env.GCP_REGION }}" \
            --description="Pocketree ML images"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push ML Docker image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          docker build -f ml-service/Dockerfile -t "$IMAGE_URI" ml-service
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --project "${{ env.GCP_PROJECT_ID }}" \
            --region "${{ env.GCP_REGION }}" \
            --platform managed \
            --image "$IMAGE_URI" \
            --port 8080 \
            --cpu 2 \
            --memory 8Gi \
            --timeout 600 \
            --concurrency 10 \
            --min-instances 1 \
            --max-instances 1 \
            --ingress all \
            --set-env-vars "GUNICORN_CMD_ARGS=--timeout 600 --preload --workers 1" \
            --allow-unauthenticated
