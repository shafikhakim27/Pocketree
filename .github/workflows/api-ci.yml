name: Backend API CI

on:
  push:
    branches: ["main", "develop"]
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - 'api/**'
      - '.github/workflows/api-ci.yml'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/pocketree-api
  AZURE_WEBAPP_NAME: pocketree-api

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: TruffleHog Secrets Scan (docker)
        run: |
          docker run --rm -v "$PWD":/repo trufflesecurity/trufflehog:latest \
            filesystem /repo \
            --only-verified \
            --json > trufflehog.json

      - name: Upload TruffleHog JSON
        if: always()
        run: |
          if [ ! -f trufflehog.json ]; then
            echo "No trufflehog.json found. Skipping upload."
            exit 0
          fi
          if [ ! -s trufflehog.json ]; then
            echo "trufflehog.json is empty. Skipping upload."
            exit 0
          fi

      - name: Upload TruffleHog Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: trufflehog-report
          path: ${{ github.workspace }}/trufflehog.json

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: 9.0.x

      - name: Restore Dependencies
        run: dotnet restore api/api.sln

      - name: Snyk Security Scan
        uses: snyk/actions/dotnet@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=api/api.sln --severity-threshold=high

      - name: Build Solution
        run: dotnet build api/api.sln --no-restore --configuration Release

      - name: Publish Test Project
        run: dotnet publish api/Pocketree.Api.Tests/Pocketree.Api.Tests.csproj --configuration Release --output ./test-artifacts
      
      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v6.0.0
        with:
          name: test-artifacts
          path: ${{ github.workspace }}/test-artifacts/

  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Test Artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          name: test-artifacts
          path: ./test-artifacts

      - name: Run Unit Tests
        run: dotnet test ./test-artifacts/Pocketree.Api.Tests.dll --logger "trx;logfilename=unit_test_results.trx" --filter "FullyQualifiedName!~Pocketree.Api.Tests.Integration"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: unit-test-results
          path: ${{ github.workspace }}/**/*.trx

      - name: Unit Test Summary
        if: always()
        run: |
          echo "Unit Tests: Completed" >> $GITHUB_STEP_SUMMARY
          
  integration-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Start services
        run: docker compose -f "docker compose.yml" up -d pocketree-db

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if docker compose -f "docker compose.yml" exec -T pocketree-db env MYSQL_PWD=password mysqladmin ping -h "localhost" -u "root" --silent; then
              echo "MySQL is ready."
              exit 0
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL did not become ready in time."
          exit 1

      - name: Download Test Artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          name: test-artifacts
          path: ./test-artifacts

      - name: Run Integration Tests
        env:
          ConnectionStrings__DefaultConnection: Server=localhost;Port=3306;Database=pocketree;User=root;Password=password
          USE_IN_MEMORY_DATABASE: false
        run: dotnet test ./test-artifacts/Pocketree.Api.Tests.dll --logger "trx;logfilename=integration_test_results.trx" --filter "FullyQualifiedName~Pocketree.Api.Tests.Integration"

      - name: Stop services
        if: always()
        run: docker compose -f "docker compose.yml" down

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          name: integration-test-results
          path: ${{ github.workspace }}/**/*.trx

      - name: Integration Test Summary
        if: always()
        run: |
          echo "Integration Tests: Completed" >> $GITHUB_STEP_SUMMARY

  summary:
    runs-on: ubuntu-latest
    needs: [secrets-scan, unit-tests, integration-tests]
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: ./artifacts

      - name: Build Summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          artifacts = []
          root = Path("artifacts")
          if root.exists():
            for p in sorted(root.rglob("*")):
              if p.is_file():
                artifacts.append(str(p))

          summary = {
            "summary": "API CI Summary",
            "secrets_scan": "Completed",
            "unit_tests": "Completed",
            "integration_tests": "Completed",
            "artifacts": artifacts
          }
          Path("summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          lines = [
            "API CI Summary",
            "Secrets Scan: Completed",
            "Unit Tests: Completed",
            "Integration Tests: Completed",
            "",
            "Artifacts:"
          ] + artifacts
          Path("summary.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload Summary
        uses: actions/upload-artifact@v6.0.0
        with:
          name: api-ci-summary
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

