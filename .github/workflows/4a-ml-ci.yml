name: 4a) ML CI (Build, Test, Scan, SAST)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 16 * * *"
    - cron: "15 22 * * *"
    - cron: "15 4 * * *"
    - cron: "15 10 * * *"
  push:
    branches: ["main", "develop"]
    paths:
      - 'ml-service/**'
      - '.github/workflows/4a-ml-ci.yml'

permissions:
  contents: read
  security-events: write

env:
  SKIP_SNYK_SARIF: "false"

jobs:
  tests:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-service/requirements.txt -r ml-service/requirements-dev.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check ml-service --exit-zero --output-format json --output-file ruff-report.json

      - name: Type Check (mypy)
        continue-on-error: true
        run: |
          pip install mypy
          mypy --config-file ml-service/mypy.ini ml-service

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-ruff-report
          path: ${{ github.workspace }}/ruff-report.json

      - name: Run ML Service Tests
        run: |
          pytest ml-service/tests --junitxml=ml-service-test-results.xml
        continue-on-error: true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-service-test-results
          path: ${{ github.workspace }}/ml-service-test-results.xml

      - name: Relaxed Checks Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          errors = 0
          warnings = 0
          details = []

          ruff = Path("ruff-report.json")
          if ruff.exists():
            try:
              data = json.loads(ruff.read_text(encoding="utf-8", errors="ignore"))
              count = len(data) if isinstance(data, list) else 0
              errors += count
              details.append(f"ruff issues={count}")
            except Exception as exc:
              details.append(f"ruff parse error: {exc}")

          junit = Path("ml-service-test-results.xml")
          if junit.exists():
            try:
              tree = ET.parse(junit)
              root = tree.getroot()
              failures = int(root.attrib.get("failures", "0"))
              errs = int(root.attrib.get("errors", "0"))
              errors += failures + errs
              details.append(f"pytest failures={failures} errors={errs}")
            except Exception as exc:
              details.append(f"pytest parse error: {exc}")

          out = Path("relaxed-checks-tests.txt")
          suggestions = []
          if errors:
            suggestions.append("Run ruff locally and fix reported issues.")
            suggestions.append("Run pytest locally and address failing tests.")
          else:
            suggestions.append("No action needed.")
          lines = [f"errors={errors} warnings={warnings}"] + details + [f"Suggested actions: {', '.join(suggestions)}"]
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          md = Path("relaxed-checks-tests.md")
          md.write_text(
            "\n".join([
              "## ML Service Relaxed Checks (tests)",
              "",
              "| Metric | Count |",
              "| --- | ---: |",
              f"| Errors | {errors} |",
              f"| Warnings | {warnings} |",
              "",
              "**Suggested actions**",
              f"- {suggestions[0]}",
              "" if len(suggestions) == 1 else f"- {suggestions[1]}",
              "",
              "Details:",
              *[f"- {d}" for d in details],
              ""
            ]),
            encoding="utf-8"
          )
          html = Path("relaxed-checks-tests.html")
          html.write_text(
            "\n".join([
              "<!doctype html>",
              "<html lang=\"en\">",
              "  <head>",
              "    <meta charset=\"utf-8\" />",
              "    <title>ML Service Relaxed Checks</title>",
              "    <style>",
              "      body {{ font-family: Arial, sans-serif; margin: 24px; }}",
              "      table {{ border-collapse: collapse; width: 360px; }}",
              "      th, td {{ border: 1px solid #ddd; padding: 8px; text-align: left; }}",
              "      th {{ background: #f3f4f6; }}",
              "      .section {{ margin-top: 16px; }}",
              "      ul {{ margin: 6px 0 0 18px; }}",
              "    </style>",
              "  </head>",
              "  <body>",
              "    <h2>ML Service Relaxed Checks (tests)</h2>",
              "    <table>",
              "      <tr><th>Metric</th><th>Count</th></tr>",
              "      <tr><td>Errors</td><td>{errors}</td></tr>",
              "      <tr><td>Warnings</td><td>{warnings}</td></tr>",
              "    </table>",
              "    <div class=\"section\"><strong>Suggested actions</strong>",
              "      <ul>",
              "        {''.join(f'<li>{s}</li>' for s in suggestions)}",
              "      </ul>",
              "    </div>",
              "    <div class=\"section\"><strong>Details</strong>",
              "      <ul>",
              "        {''.join(f'<li>{d}</li>' for d in details)}",
              "      </ul>",
              "    </div>",
              "  </body>",
              "</html>"
            ]),
            encoding="utf-8"
          )
          PY
          cat relaxed-checks-tests.txt >> $GITHUB_STEP_SUMMARY
          cat relaxed-checks-tests.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Relaxed Checks Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-relaxed-checks-tests
          path: |
            ${{ github.workspace }}/relaxed-checks-tests.txt
            ${{ github.workspace }}/relaxed-checks-tests.md
            ${{ github.workspace }}/relaxed-checks-tests.html

      - name: Build Relaxed Dashboard
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import html

          files = sorted(Path(".").glob("relaxed-checks*.txt"))
          rows = []
          strict_errors = 0
          strict_warnings = 0
          for f in files:
            lines = f.read_text(encoding="utf-8", errors="ignore").splitlines()
            header = lines[0] if lines else ""
            errors = warnings = "0"
            if header.startswith("errors="):
              parts = dict(p.split("=") for p in header.split() if "=" in p)
              errors = parts.get("errors", "0")
              warnings = parts.get("warnings", "0")
            actions = ""
            for line in lines:
              if line.lower().startswith("suggested actions:"):
                actions = line.split(":", 1)[1].strip()
                break
            rows.append((f.name, errors, warnings, actions))
            strict_errors += int(errors)
            strict_warnings += int(warnings)

          status = "PASS"
          if strict_errors > 0:
            status = "FAIL"
          elif strict_warnings > 0:
            status = "WARN"

          html_out = Path("relaxed-dashboard.html")
          html_out.write_text(
            "<!doctype html><html><head><meta charset='utf-8'/>"
            "<title>Relaxed Checks Dashboard</title>"
            "<style>body{font-family:Arial,sans-serif;margin:24px;}table{border-collapse:collapse;width:100%;}"
            "th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#f3f4f6;}"
            ".ok{color:#0f7b0f;font-weight:600}.warn{color:#b26a00;font-weight:600}.fail{color:#b00020;font-weight:600}</style>"
            "</head><body><h2>Relaxed Checks Dashboard</h2>"
            "<h3>Strictest Checks (Summary)</h3>"
            f"<p>Status: <span class='{status.lower()}'>{status}</span></p>"
            "<table><tr><th>Metric</th><th>Count</th></tr>"
            f"<tr><td>Errors</td><td>{strict_errors}</td></tr>"
            f"<tr><td>Warnings</td><td>{strict_warnings}</td></tr>"
            "</table>"
            "<table><tr><th>Check</th><th>Errors</th><th>Warnings</th><th>Suggested actions</th></tr>" +
            "".join(
              f"<tr><td>{html.escape(name)}</td><td>{html.escape(err)}</td><td>{html.escape(warn)}</td>"
              f"<td>{html.escape(act)}</td></tr>"
              for name, err, warn, act in rows
            ) +
            "</table></body></html>",
            encoding="utf-8"
          )
          PY

      - name: Upload Relaxed Dashboard
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-relaxed-dashboard
          path: ${{ github.workspace }}/relaxed-dashboard.html

      - name: Build Summary
        if: always()
        run: |
          echo "ML Service Tests: Completed" >> "$GITHUB_STEP_SUMMARY"

  security-scans:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Snyk Python Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=ml-service/requirements.txt --severity-threshold=high --skip-unresolved --json-file-output=ml-service-snyk.json --sarif-file-output=ml-service-snyk.sarif

      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r ml-service/ -lll -iii -f json -o bandit-report.json

      - name: Check Snyk SARIF
        if: always()
        run: |
          if [ ! -s ml-service-snyk.sarif ]; then
            echo "SKIP_SNYK_SARIF=true" >> $GITHUB_ENV
            echo "Snyk SARIF missing or empty, skipping upload."
          fi

      - name: Upload Snyk SARIF
        if: always() && env.SKIP_SNYK_SARIF != 'true'
        uses: github/codeql-action/upload-sarif@v4.31.10
        with:
          sarif_file: ml-service-snyk.sarif

      - name: Code Scanning Links
        if: always()
        run: |
          echo "Code Scanning UI: https://github.com/${{ github.repository }}/security/code-scanning" >> $GITHUB_STEP_SUMMARY
          echo "Run Artifacts: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}?tab=artifacts" >> $GITHUB_STEP_SUMMARY

      - name: Upload Snyk Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-snyk-report
          path: |
            ${{ github.workspace }}/ml-service-snyk.json
            ${{ github.workspace }}/ml-service-snyk.sarif

      - name: Upload Bandit Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-bandit-report
          path: ${{ github.workspace }}/bandit-report.json

      - name: Security Summary
        if: always()
        run: |
          echo "ML Service Security Scans: Completed" >> $GITHUB_STEP_SUMMARY

      - name: Build Summary
        if: always()
        run: |
          cat > summary.json <<'JSON'
          {
            "summary": "ML Service CI Summary",
            "snyk": "Completed",
            "bandit": "Completed"
          }
          JSON
          cat > summary.txt <<'TXT'
          ML Service CI Summary
          Snyk: Completed
          Bandit: Completed
          TXT
          cat summary.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-service-ci-summary
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

