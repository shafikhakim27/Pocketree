name: 3a) API CI (Build, Test, Scan, SAST)

on:
  workflow_dispatch:
  schedule:
    - cron: "12 16 * * *"
    - cron: "12 22 * * *"
    - cron: "12 4 * * *"
    - cron: "12 10 * * *"
  push:
    branches: ["main", "develop"]
    paths:
      - 'api/**'
      - '.github/workflows/3a-api-ci.yml'
permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/pocketree-api
  AZURE_WEBAPP_NAME: pocketree-api

jobs:
  build:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: 9.0.x

      - name: Restore Dependencies
        run: dotnet restore api/api.sln

      - name: Lint (dotnet format)
        run: |
          dotnet tool install --global dotnet-format
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
          dotnet format api/api.sln --verify-no-changes --report format-report.json
        continue-on-error: true

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: api-dotnet-format-report
          path: ${{ github.workspace }}/format-report.json

      - name: Relaxed Lint Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("format-report.json")
          errors = 0
          warnings = 0
          if report.exists():
            text = report.read_text(encoding="utf-8", errors="ignore")
            # best-effort counts
            errors = text.count('"severity":"error"')
            warnings = text.count('"severity":"warning"')
          out = Path("relaxed-checks.txt")
          suggestions = []
          if errors or warnings:
            suggestions.append("Run `dotnet format api/api.sln` locally and commit fixes.")
          else:
            suggestions.append("No action needed.")
          out.write_text(
            f"errors={errors} warnings={warnings}\n"
            f"dotnet-format errors={errors} warnings={warnings}\n"
            f"Suggested actions: {', '.join(suggestions)}\n",
            encoding="utf-8"
          )
          md = Path("relaxed-checks.md")
          md.write_text(
            "\n".join([
              "## API Relaxed Checks (dotnet format)",
              "",
              "| Metric | Count |",
              "| --- | ---: |",
              f"| Errors | {errors} |",
              f"| Warnings | {warnings} |",
              "",
              "**Suggested actions**",
              f"- {suggestions[0]}",
              "",
              "Details:",
              f"- dotnet-format errors={errors} warnings={warnings}",
              ""
            ]),
            encoding="utf-8"
          )
          html = Path("relaxed-checks.html")
          html.write_text(
            "\n".join([
              "<!doctype html>",
              "<html lang=\"en\">",
              "  <head>",
              "    <meta charset=\"utf-8\" />",
              "    <title>API Relaxed Checks</title>",
              "    <style>",
              "      body {{ font-family: Arial, sans-serif; margin: 24px; }}",
              "      table {{ border-collapse: collapse; width: 320px; }}",
              "      th, td {{ border: 1px solid #ddd; padding: 8px; text-align: left; }}",
              "      th {{ background: #f3f4f6; }}",
              "      .section {{ margin-top: 16px; }}",
              "    </style>",
              "  </head>",
              "  <body>",
              "    <h2>API Relaxed Checks (dotnet format)</h2>",
              "    <table>",
              "      <tr><th>Metric</th><th>Count</th></tr>",
              "      <tr><td>Errors</td><td>{errors}</td></tr>",
              "      <tr><td>Warnings</td><td>{warnings}</td></tr>",
              "    </table>",
              "    <div class=\"section\"><strong>Suggested actions</strong><div>{suggestions[0]}</div></div>",
              "    <div class=\"section\"><strong>Details</strong><div>dotnet-format errors={errors} warnings={warnings}</div></div>",
              "  </body>",
              "</html>"
            ]),
            encoding="utf-8"
          )
          PY
          cat relaxed-checks.txt >> $GITHUB_STEP_SUMMARY
          cat relaxed-checks.md >> $GITHUB_STEP_SUMMARY
          
      - name: Upload Relaxed Lint Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: api-relaxed-checks
          path: |
            ${{ github.workspace }}/relaxed-checks.txt
            ${{ github.workspace }}/relaxed-checks.md
            ${{ github.workspace }}/relaxed-checks.html

      - name: Build Relaxed Dashboard
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import html

          files = sorted(Path(".").glob("relaxed-checks*.txt"))
          rows = []
          strict_errors = 0
          strict_warnings = 0
          for f in files:
            lines = f.read_text(encoding="utf-8", errors="ignore").splitlines()
            header = lines[0] if lines else ""
            errors = warnings = "0"
            if header.startswith("errors="):
              parts = dict(p.split("=") for p in header.split() if "=" in p)
              errors = parts.get("errors", "0")
              warnings = parts.get("warnings", "0")
            actions = ""
            for line in lines:
              if line.lower().startswith("suggested actions:"):
                actions = line.split(":", 1)[1].strip()
                break
            rows.append((f.name, errors, warnings, actions))
            strict_errors += int(errors)
            strict_warnings += int(warnings)

          status = "PASS"
          if strict_errors > 0:
            status = "FAIL"
          elif strict_warnings > 0:
            status = "WARN"

          html_out = Path("relaxed-dashboard.html")
          html_out.write_text(
            "<!doctype html><html><head><meta charset='utf-8'/>"
            "<title>Relaxed Checks Dashboard</title>"
            "<style>body{font-family:Arial,sans-serif;margin:24px;}table{border-collapse:collapse;width:100%;}"
            "th,td{border:1px solid #ddd;padding:8px;text-align:left;}th{background:#f3f4f6;}"
            ".ok{color:#0f7b0f;font-weight:600}.warn{color:#b26a00;font-weight:600}.fail{color:#b00020;font-weight:600}</style>"
            "</head><body><h2>Relaxed Checks Dashboard</h2>"
            "<h3>Strictest Checks (Summary)</h3>"
            f"<p>Status: <span class='{status.lower()}'>{status}</span></p>"
            "<table><tr><th>Metric</th><th>Count</th></tr>"
            f"<tr><td>Errors</td><td>{strict_errors}</td></tr>"
            f"<tr><td>Warnings</td><td>{strict_warnings}</td></tr>"
            "</table>"
            "<table><tr><th>Check</th><th>Errors</th><th>Warnings</th><th>Suggested actions</th></tr>" +
            "".join(
              f"<tr><td>{html.escape(name)}</td><td>{html.escape(err)}</td><td>{html.escape(warn)}</td>"
              f"<td>{html.escape(act)}</td></tr>"
              for name, err, warn, act in rows
            ) +
            "</table></body></html>",
            encoding="utf-8"
          )
          PY

      - name: Upload Relaxed Dashboard
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: api-relaxed-dashboard
          path: ${{ github.workspace }}/relaxed-dashboard.html

      - name: Snyk Security Scan
        uses: snyk/actions/dotnet@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=api/api.sln --severity-threshold=high

      - name: Build Solution
        run: dotnet build api/api.sln --no-restore --configuration Release

      - name: Publish Test Project
        run: dotnet publish api/Pocketree.Api.Tests/Pocketree.Api.Tests.csproj --configuration Release --output ./test-artifacts
      
      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: test-artifacts
          path: ${{ github.workspace }}/test-artifacts/

  unit-tests:
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Test Artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          name: test-artifacts
          path: ./test-artifacts

      - name: Run Unit Tests
        run: dotnet test ./test-artifacts/Pocketree.Api.Tests.dll --logger "trx;logfilename=unit_test_results.trx" --collect:"XPlat Code Coverage" --filter "FullyQualifiedName!~Pocketree.Api.Tests.Integration"

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: unit-test-results
          path: ${{ github.workspace }}/**/*.trx

      - name: Upload Unit Test Coverage
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: unit-test-coverage
          path: ${{ github.workspace }}/**/coverage.cobertura.xml

      - name: Unit Test Summary
        if: always()
        run: |
          echo "Unit Tests: Completed" >> $GITHUB_STEP_SUMMARY
          
  integration-tests:
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2

      - name: Start services
        run: docker compose -f "docker compose.yml" up -d pocketree-db

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            if docker compose -f "docker compose.yml" exec -T pocketree-db env MYSQL_PWD=password mysqladmin ping -h "localhost" -u "root" --silent; then
              echo "MySQL is ready."
              exit 0
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done
          echo "MySQL did not become ready in time."
          exit 1

      - name: Download Test Artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          name: test-artifacts
          path: ./test-artifacts

      - name: Run Integration Tests
        env:
          ConnectionStrings__DefaultConnection: Server=localhost;Port=3306;Database=pocketree;User=root;Password=password
          USE_IN_MEMORY_DATABASE: false
        run: dotnet test ./test-artifacts/Pocketree.Api.Tests.dll --logger "trx;logfilename=integration_test_results.trx" --collect:"XPlat Code Coverage" --filter "FullyQualifiedName~Pocketree.Api.Tests.Integration"

      - name: Stop services
        if: always()
        run: docker compose -f "docker compose.yml" down

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: integration-test-results
          path: ${{ github.workspace }}/**/*.trx

      - name: Upload Integration Test Coverage
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: integration-test-coverage
          path: ${{ github.workspace }}/**/coverage.cobertura.xml

      - name: Integration Test Summary
        if: always()
        run: |
          echo "Integration Tests: Completed" >> $GITHUB_STEP_SUMMARY

  summary:
    continue-on-error: true
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: ./artifacts

      - name: Build Summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          artifacts = []
          root = Path("artifacts")
          trx_files = []
          failed = 0
          total = 0
          if root.exists():
            for p in sorted(root.rglob("*")):
              if p.is_file():
                artifacts.append(str(p))
                if p.suffix.lower() == ".trx":
                  trx_files.append(p)

          for trx in trx_files:
            try:
              tree = ET.parse(trx)
              root_xml = tree.getroot()
              # TRX uses "Counters" element for totals
              counters = root_xml.find(".//{*}Counters")
              if counters is not None:
                total += int(counters.attrib.get("total", "0"))
                failed += int(counters.attrib.get("failed", "0"))
            except Exception:
              continue

          summary = {
            "summary": "API CI Summary",
            "secrets_scan": "Completed",
            "unit_tests": "Completed",
            "integration_tests": "Completed",
            "trx_total": total,
            "trx_failed": failed,
            "artifacts": artifacts
          }
          Path("summary.json").write_text(json.dumps(summary, indent=2), encoding="utf-8")
          lines = [
            "API CI Summary",
            "Secrets Scan: Completed",
            "Unit Tests: Completed",
            "Integration Tests: Completed",
            f"TRX Total: {total}",
            f"TRX Failed: {failed}",
            "",
            "Artifacts:"
          ] + artifacts
          Path("summary.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload Summary
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: api-ci-summary
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

      - name: Step Summary
        if: always()
        run: |
          cat summary.txt >> $GITHUB_STEP_SUMMARY

