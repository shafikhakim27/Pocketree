name: 0. Contribution Report

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-contribution-report:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Generate Contribution Report
        run: |
          mkdir -p report
          python - <<'PY'
          import subprocess
          from pathlib import Path

          shortlog = subprocess.check_output(["git", "shortlog", "-sne"], text=True, encoding="utf-8")
          commits_by_author = []
          for line in shortlog.strip().splitlines():
            parts = line.strip().split("\t", 1)
            if len(parts) == 2:
              count, author = parts
              commits_by_author.append({"author": author, "commits": int(count)})

          lines = [
            "Contribution Report",
            "",
            "Commits by Author:"
          ]
          lines += [f"{c['commits']}\t{c['author']}" for c in commits_by_author]
          Path("report/contribution-report.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat report/contribution-report.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload Contribution Report
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: contribution-report
          path: |
            ${{ github.workspace }}/report/contribution-report.txt
