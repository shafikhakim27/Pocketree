name: 1e) Run All Workflows

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

    - cron: "0 20 * * *"
permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger all workflows
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const workflows = [
              "3a-api-ci.yml",
              "3b-api-cd-azure.yml",
              "3c-api-dast.yml",
              "2a-android-ci.yml",
              "2d-android-ui-maestro.yml",
              "2c-android-cd-release.yml",
              "2b-android-mobsfscan-sast.yml",
              "1a-code-quality.yml",
              "1c-contribution-report.yml",
              "4a-ml-ci.yml",
              "4b-ml-cd-gcp.yml",
              "4d-ml-v2-ci.yml",
              "4f-ml-v2-cd.yml",
              "4e-ml-v3-ci.yml",
              "4g-ml-v3-cd.yml",
              "4c-ml-dast.yml",
              "1d-pipeline-artifacts.yml",
              "1b-security-tests-report.yml"
            ];

            const wfList = await github.rest.actions.listRepoWorkflows({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            const byPath = new Map(
              (wfList.data.workflows || []).map(wf => [wf.path.replace(".github/workflows/", ""), wf])
            );

            const failures = [];
            for (const wf of workflows) {
              const wfInfo = byPath.get(wf);
              if (!wfInfo) {
                const msg = "Workflow not found in repo workflow list";
                core.warning(`Failed to dispatch ${wf}: ${msg}`);
                failures.push({ workflow: wf, error: msg });
                continue;
              }
              core.info(`Dispatching ${wf} (id=${wfInfo.id})`);
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: wfInfo.id,
                  ref: context.ref.replace("refs/heads/", "")
                });
              } catch (err) {
                const msg = err?.message || String(err);
                core.warning(`Failed to dispatch ${wf}: ${msg}`);
                failures.push({ workflow: wf, error: msg });
              }
            }

            core.info(`Dispatch complete. Failures: ${failures.length}`);
            if (failures.length) {
              core.setOutput("dispatch_failures", JSON.stringify(failures));
              const lines = failures.map(f => `- ${f.workflow}: ${f.error}`);
              core.summary.addHeading("Dispatch Failures");
              core.summary.addRaw(lines.join("\n"));
              await core.summary.write();
            }

