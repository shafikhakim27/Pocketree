name: 1e) Run All Workflows

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

    - cron: "0 20 * * *"
permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger all workflows
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const workflows = [
              "3a-api-ci.yml",
              "3b-api-cd-azure.yml",
              "3c-api-dast.yml",
              "2a-android-ci.yml",
              "2d-android-ui-maestro.yml",
              "2c-android-cd-release.yml",
              "2b-android-mobsfscan-sast.yml",
              "1a-code-quality.yml",
              "1c-contribution-report.yml",
              "4a-ml-ci.yml",
              "4b-ml-cd-gcp.yml",
              "4d-ml-v2-ci.yml",
              "4f-ml-v2-cd.yml",
              "4e-ml-v3-ci.yml",
              "4g-ml-v3-cd.yml",
              "4c-ml-dast.yml",
              "1d-pipeline-artifacts.yml",
              "1b-security-tests-report.yml"
            ];

            for (const wf of workflows) {
              core.info(`Dispatching ${wf}`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf,
                ref: context.ref.replace("refs/heads/", "")
              });
            }

