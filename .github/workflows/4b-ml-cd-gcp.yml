name: 4b) ML CD (Deploy - GCP)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * *"
    - cron: "30 22 * * *"
    - cron: "30 4 * * *"
    - cron: "30 10 * * *"
  workflow_run:
    workflows: ["4a) ML CI (Build, Test, Scan, SAST)"]
    types:
      - completed

env:
  GCP_PROJECT_ID: pocketree-ml-service
  GCP_REGION: asia-southeast1
  AR_REPO: pocketree-ml
  IMAGE_NAME: pocketree-ml
  MODEL_DISPLAY_NAME: pocketree-ml
  FALLBACK_MODEL_ID: "1886150624798572544"
  ENDPOINT_DISPLAY_NAME: pocketree-ml-endpoint
  MACHINE_TYPE: n1-standard-4
  ACCELERATOR_TYPE: nvidia-tesla-t4
  ACCELERATOR_COUNT: "1"
  MIN_REPLICA_COUNT: "1"
  MAX_REPLICA_COUNT: "1"

jobs:
  build-and-deploy-ml:
    continue-on-error: true
    concurrency:
      group: ml-cd-gcp-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_VERTEX_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Ensure Artifact Registry exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location "${{ env.GCP_REGION }}" || \
          gcloud artifacts repositories create "${{ env.AR_REPO }}" \
            --repository-format=docker \
            --location "${{ env.GCP_REGION }}" \
            --description="Pocketree ML images"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push ML Docker image
        id: build_image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          docker build -f ml-service/Dockerfile -t "$IMAGE_URI" ml-service
          docker push "$IMAGE_URI"

      - name: Free Disk Space
        run: |
          docker system prune -af
          docker builder prune -af

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build_image.outputs.image_uri }}
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Ensure Vertex AI Endpoint exists
        id: ensure_endpoint
        run: |
          set -euo pipefail
          unset CLOUDSDK_API_ENDPOINT_OVERRIDES_AIPLATFORM
          ENDPOINT_ID="$(gcloud ai endpoints list \
            --region "${{ env.GCP_REGION }}" \
            --filter="display_name=${{ env.ENDPOINT_DISPLAY_NAME }}" \
            --limit=1 \
            --format="value(name)")"

          if [ -z "$ENDPOINT_ID" ]; then
            ENDPOINT_ID="$(gcloud ai endpoints create \
              --region "${{ env.GCP_REGION }}" \
              --display-name "${{ env.ENDPOINT_DISPLAY_NAME }}" \
              --format="value(name)")"
          fi

          echo "ENDPOINT_ID=$ENDPOINT_ID" >> "$GITHUB_ENV"
          echo "endpoint_id=$ENDPOINT_ID" >> "$GITHUB_OUTPUT"

      - name: Cleanup Failed Deployments
        run: |
          set -euo pipefail
          unset CLOUDSDK_API_ENDPOINT_OVERRIDES_AIPLATFORM
          failed_ids=$(gcloud ai endpoints describe "$ENDPOINT_ID" \
            --region "${{ env.GCP_REGION }}" \
            --format="json" > endpoint.json || true
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("endpoint.json")
          if not p.exists() or not p.read_text(encoding="utf-8").strip():
            print("")
            raise SystemExit(0)
          data = json.loads(p.read_text(encoding="utf-8"))
          ids = []
          for dm in data.get("deployedModels", []):
            if dm.get("status", "") == "FAILED":
              ids.append(dm.get("id"))
          print(" ".join(ids))
          PY
          )
          if [ -n "$failed_ids" ]; then
            for id in $failed_ids; do
              echo "Undeploying failed deployment $id"
              gcloud ai endpoints undeploy-model "$ENDPOINT_ID" \
                --region "${{ env.GCP_REGION }}" \
                --deployed-model-id "$id" || true
            done
          else
            echo "No failed deployments to remove."
          fi

      - name: Enforce Single Deployment (Undeploy Existing)
        run: |
          set -euo pipefail
          unset CLOUDSDK_API_ENDPOINT_OVERRIDES_AIPLATFORM
          deployed_ids=$(gcloud ai endpoints describe "$ENDPOINT_ID" \
            --region "${{ env.GCP_REGION }}" \
            --format="json" | \
            python - <<'PY'
          import json, sys
          data = json.load(sys.stdin)
          ids = [dm.get("id") for dm in data.get("deployedModels", []) if dm.get("id")]
          print(" ".join(ids))
          PY
          )
          if [ -n "$deployed_ids" ]; then
            for id in $deployed_ids; do
              echo "Undeploying existing deployment $id"
              gcloud ai endpoints undeploy-model "$ENDPOINT_ID" \
                --region "${{ env.GCP_REGION }}" \
                --deployed-model-id "$id"
            done
          else
            echo "No existing deployments to remove."
          fi

      - name: Compute Deployment Display Name
        id: compute_display
        run: |
          set -euo pipefail
          unset CLOUDSDK_API_ENDPOINT_OVERRIDES_AIPLATFORM
          names=$(gcloud ai endpoints describe "$ENDPOINT_ID" \
            --region "${{ env.GCP_REGION }}" \
            --format="json" | \
            python - <<'PY'
          import json, sys, re
          data = json.load(sys.stdin)
          names = []
          for dm in data.get("deployedModels", []):
            name = dm.get("displayName", "")
            if name.startswith("pocketree-ml-deploy "):
              names.append(name)
          print("\\n".join(names))
          PY
          )
          max_n=0
          if [ -n "$names" ]; then
            max_n=$(python - <<'PY'
          import sys, re
          nums=[]
          for line in sys.stdin.read().splitlines():
            m=re.search(r"pocketree-ml-deploy\\s+(\\d+)$", line.strip())
            if m:
              nums.append(int(m.group(1)))
          print(max(nums) if nums else 0)
          PY
            <<< "$names")
          fi
          next_n=$((max_n+1))
          echo "DEPLOY_DISPLAY_NAME=pocketree-ml-deploy $next_n" >> "$GITHUB_ENV"
          echo "deploy_display_name=pocketree-ml-deploy $next_n" >> "$GITHUB_OUTPUT"

      - name: Deploy Model to Vertex AI Endpoint
        run: |
          set -euo pipefail
          unset CLOUDSDK_API_ENDPOINT_OVERRIDES_AIPLATFORM
          gcloud ai endpoints deploy-model "$ENDPOINT_ID" \
            --region "${{ env.GCP_REGION }}" \
            --model "$MODEL_ID" \
            --display-name "${{ env.DEPLOY_DISPLAY_NAME }}" \
            --machine-type "${{ env.MACHINE_TYPE }}" \
            --accelerator "type=${{ env.ACCELERATOR_TYPE }},count=${{ env.ACCELERATOR_COUNT }}" \
            --min-replica-count "${{ env.MIN_REPLICA_COUNT }}" \
            --max-replica-count "${{ env.MAX_REPLICA_COUNT }}" \
            --traffic-split "0=100"

