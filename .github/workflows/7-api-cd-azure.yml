name: 7. API CD (Deploy - Azure)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'api/**'
      - '.github/workflows/7-api-cd-azure.yml'
  workflow_run:
    workflows: ["6. API CI (Build, Test, Scan, SAST)"]
    types:
      - completed
    branches: ["main"]

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/pocketree-api
  AZURE_WEBAPP_NAME: pocketree-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: 9.0.x

      # Docker Build & Push
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Free Disk Space
        run: |
          docker system prune -af
          docker builder prune -af

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'json'
          output: 'trivy-report.json'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Azure Login
        uses: azure/login@v2.3.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2.2.17
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: '${{ env.IMAGE_NAME }}:sha-${{ github.sha }}'

      - name: API DAST (OWASP ZAP Baseline)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: https://pocketree-api.azurewebsites.net
          cmd_options: "-J zap_report.json -r zap_report.html -T 1200 -z \"-config connection.timeoutInSecs=120 -config spider.maxDuration=5\""
          fail_action: false

      - name: Ensure Scan Report Files Exist
        if: always()
        run: |
          set -euo pipefail
          [ -f trivy-report.json ] || echo '{"note":"trivy report missing"}' > trivy-report.json
          [ -f zap_report.json ] || echo '{"site":[],"note":"zap report missing"}' > zap_report.json
          [ -f zap_report.html ] || echo "<html><body>ZAP report missing</body></html>" > zap_report.html

      - name: Fail on High Confidence Alerts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("zap_report.json")
          if not report.exists():
              print("ZAP report not found; skipping confidence check.")
              raise SystemExit(0)

          data = json.loads(report.read_text(encoding="utf-8", errors="ignore"))
          alerts = []
          for site in data.get("site", []):
              alerts.extend(site.get("alerts", []))

          high = [a for a in alerts if str(a.get("confidence", "")).lower() == "high"]
          print(f"Total alerts: {len(alerts)} | High confidence: {len(high)}")
          if high:
              raise SystemExit(1)
          PY

      - name: Upload API Scan Reports
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: api-security-scan-reports
          path: |
            ${{ github.workspace }}/trivy-report.json
            ${{ github.workspace }}/zap_report.json
            ${{ github.workspace }}/zap_report.html

