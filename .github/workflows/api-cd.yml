name: Backend API CD

on:
  push:
    branches: ["main"]
    paths:
      - 'api/**'
      - '.github/workflows/api-cd.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USER }}/pocketree-api
  AZURE_WEBAPP_NAME: pocketree-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: 9.0.x

      # Docker Build & Push
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.9.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Free Disk Space
        run: |
          docker system prune -af
          docker builder prune -af

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: 'json'
          output: 'trivy-report.json'
          skip-version-check: 'true'
          exit-code: '1'
          severity: 'CRITICAL'
          ignore-unfixed: true

      - name: Build Trivy Text Report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path("trivy-report.json")
          out = Path("trivy-report.txt")
          if not src.exists():
            out.write_text("Trivy report not found.\n", encoding="utf-8")
            raise SystemExit(0)
          data = json.loads(src.read_text(encoding="utf-8", errors="ignore") or "{}")
          results = data.get("Results", [])
          lines = ["Trivy Report", f"Targets: {len(results)}"]
          for r in results:
            target = r.get("Target", "unknown")
            vulns = r.get("Vulnerabilities", []) or []
            lines.append(f"- {target}: {len(vulns)} findings")
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: trivy-report
          path: |
            ${{ github.workspace }}/trivy-report.json
            ${{ github.workspace }}/trivy-report.txt

      - name: Build Summary
        if: always()
        run: |
          cat > summary.json <<'JSON'
          {
            "summary": "API CD Summary",
            "docker_build_push": "Completed",
            "trivy_scan": "Completed"
          }
          JSON
          cat > summary.txt <<'TXT'
          API CD Summary
          Docker Build & Push: Completed
          Trivy Scan: Completed
          TXT

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: api-cd-summary
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

      - name: Azure Login
        uses: azure/login@v2.3.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2.2.17
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: '${{ env.IMAGE_NAME }}:sha-${{ github.sha }}'

