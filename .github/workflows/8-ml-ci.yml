name: 8. ML CI (Build, Test, Scan, SAST)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 16 * * *"
    - cron: "15 22 * * *"
    - cron: "15 4 * * *"
    - cron: "15 10 * * *"
  push:
    branches: ["main", "develop"]
    paths:
      - 'ml-service/**'
      - 'ml-service-chat/**'
      - 'ml-service-classify/**'
      - '.github/workflows/8-ml-ci.yml'

permissions:
  contents: read
  security-events: write

env:
  SKIP_SNYK_SARIF: "false"

jobs:
  tests:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-service/requirements.txt -r ml-service/requirements-dev.txt
          pip install -r ml-service-chat/requirements.txt -r ml-service-chat/requirements-dev.txt
          pip install -r ml-service-classify/requirements.txt -r ml-service-classify/requirements-dev.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check ml-service --exit-zero --output-format json --output-file ruff-report.json
          ruff check ml-service-chat --exit-zero --output-format json --output-file ruff-report-v2.json
          ruff check ml-service-classify --exit-zero --output-format json --output-file ruff-report-v3.json

      - name: Type Check (mypy)
        continue-on-error: true
        run: |
          pip install mypy
          mypy --config-file ml-service/mypy.ini ml-service
          mypy --config-file ml-service-chat/mypy.ini ml-service-chat
          mypy --config-file ml-service-classify/mypy.ini ml-service-classify

      - name: Run ML Service Tests
        run: |
          pytest ml-service/tests --junitxml=ml-service-test-results.xml
        continue-on-error: true

      - name: Run ML Service v2 Tests
        run: |
          pytest ml-service-chat/tests --junitxml=ml-service-v2-test-results.xml
        continue-on-error: true

      - name: Run ML Service v3 Tests
        run: |
          pytest ml-service-classify/tests --junitxml=ml-service-v3-test-results.xml
        continue-on-error: true

      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Snyk Python Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=ml-service/requirements.txt --severity-threshold=high --skip-unresolved --json-file-output=ml-service-snyk.json --sarif-file-output=ml-service-snyk.sarif

      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r ml-service/ -lll -iii -f json -o bandit-report.json

      - name: Check Snyk SARIF
        if: always()
        run: |
          if [ ! -s ml-service-snyk.sarif ]; then
            echo "SKIP_SNYK_SARIF=true" >> $GITHUB_ENV
            echo "Snyk SARIF missing or empty, skipping upload."
          fi

      - name: Upload Snyk SARIF
        if: always() && env.SKIP_SNYK_SARIF != 'true'
        uses: github/codeql-action/upload-sarif@v4.31.10
        with:
          sarif_file: ml-service-snyk.sarif

