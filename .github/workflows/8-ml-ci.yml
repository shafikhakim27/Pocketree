name: 8. ML CI (Build, Test, Scan, SAST)

on:
  workflow_dispatch:
  schedule:
    - cron: "15 16 * * *"
    - cron: "15 22 * * *"
    - cron: "15 4 * * *"
    - cron: "15 10 * * *"
  push:
    branches: ["main", "develop"]
    paths:
      - 'ml-service/**'
      - 'ml-service-chat/**'
      - 'ml-service-classify/**'
      - '.github/workflows/8-ml-ci.yml'

permissions:
  contents: read
  security-events: write

env:
  SKIP_SNYK_SARIF_PREDICT: "false"
  SKIP_SNYK_SARIF_CHAT: "false"
  SKIP_SNYK_SARIF_CLASSIFY: "false"

jobs:
  tests:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v6.1.0
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-service/requirements.txt -r ml-service/requirements-dev.txt
          pip install -r ml-service-chat/requirements.txt -r ml-service-chat/requirements-dev.txt
          pip install -r ml-service-classify/requirements.txt -r ml-service-classify/requirements-dev.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check ml-service --exit-zero --output-format json --output-file ruff-report.json
          ruff check ml-service-chat --exit-zero --output-format json --output-file ruff-report-chat.json
          ruff check ml-service-classify --exit-zero --output-format json --output-file ruff-report-classify.json

      - name: Type Check (mypy)
        continue-on-error: true
        run: |
          pip install mypy
          mypy --config-file ml-service/mypy.ini ml-service
          mypy --config-file ml-service-chat/mypy.ini ml-service-chat
          mypy --config-file ml-service-classify/mypy.ini ml-service-classify

      - name: Run ML Service Tests
        run: |
          pytest ml-service/tests --junitxml=ml-service-test-results.xml
        continue-on-error: true

      - name: Run ML Service Chat Tests
        run: |
          pytest ml-service-chat/tests --junitxml=ml-service-chat-test-results.xml
        continue-on-error: true

      - name: Run ML Service Classify Tests
        run: |
          pytest ml-service-classify/tests --junitxml=ml-service-classify-test-results.xml
        continue-on-error: true

      - name: Snyk Python Scan (Predict)
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=ml-service/requirements.txt --severity-threshold=high --skip-unresolved --json-file-output=ml-service-predict-snyk.json --sarif-file-output=ml-service-predict-snyk.sarif

      - name: Snyk Python Scan (Chat)
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=ml-service-chat/requirements.txt --severity-threshold=high --skip-unresolved --json-file-output=ml-service-chat-snyk.json --sarif-file-output=ml-service-chat-snyk.sarif

      - name: Snyk Python Scan (Classify)
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=ml-service-classify/requirements.txt --severity-threshold=high --skip-unresolved --json-file-output=ml-service-classify-snyk.json --sarif-file-output=ml-service-classify-snyk.sarif

      - name: Run Bandit
        run: |
          pip install bandit
          bandit -r ml-service/ ml-service-chat/ ml-service-classify/ -lll -iii -f json -o bandit-report.json

      - name: Check Snyk SARIF (Predict)
        if: always()
        run: |
          if [ ! -s ml-service-predict-snyk.sarif ]; then
            echo "SKIP_SNYK_SARIF_PREDICT=true" >> $GITHUB_ENV
            echo "Predict SARIF missing or empty, skipping upload."
          fi

      - name: Check Snyk SARIF (Chat)
        if: always()
        run: |
          if [ ! -s ml-service-chat-snyk.sarif ]; then
            echo "SKIP_SNYK_SARIF_CHAT=true" >> $GITHUB_ENV
            echo "Chat SARIF missing or empty, skipping upload."
          fi

      - name: Check Snyk SARIF (Classify)
        if: always()
        run: |
          if [ ! -s ml-service-classify-snyk.sarif ]; then
            echo "SKIP_SNYK_SARIF_CLASSIFY=true" >> $GITHUB_ENV
            echo "Classify SARIF missing or empty, skipping upload."
          fi

      - name: Upload Snyk SARIF (Predict)
        if: always() && env.SKIP_SNYK_SARIF_PREDICT != 'true'
        uses: github/codeql-action/upload-sarif@v4.31.10
        with:
          sarif_file: ml-service-predict-snyk.sarif

      - name: Upload Snyk SARIF (Chat)
        if: always() && env.SKIP_SNYK_SARIF_CHAT != 'true'
        uses: github/codeql-action/upload-sarif@v4.31.10
        with:
          sarif_file: ml-service-chat-snyk.sarif

      - name: Upload Snyk SARIF (Classify)
        if: always() && env.SKIP_SNYK_SARIF_CLASSIFY != 'true'
        uses: github/codeql-action/upload-sarif@v4.31.10
        with:
          sarif_file: ml-service-classify-snyk.sarif

