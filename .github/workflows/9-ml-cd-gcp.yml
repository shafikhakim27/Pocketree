name: 9. ML CD (Deploy - GCP)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 16 * * *"
    - cron: "30 22 * * *"
    - cron: "30 4 * * *"
    - cron: "30 10 * * *"
  push:
    branches: ["main"]
    paths:
      - 'ml-service/**'
      - 'ml-service-chat/**'
      - 'ml-service-classify/**'
      - '.github/workflows/9-ml-cd-gcp.yml'
  workflow_run:
    workflows: ["8. ML CI (Build, Test, Scan, SAST)"]
    types:
      - completed

concurrency:
  group: 9-ml-cd-gcp-global
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: pocketree-ml-service
  GCP_REGION: asia-southeast1
  AR_REPO: pocketree-ml
  IMAGE_NAME: pocketree-ml
  MODEL_DISPLAY_NAME: pocketree-ml
  FALLBACK_MODEL_ID: "1886150624798572544"
  ENDPOINT_DISPLAY_NAME: pocketree-ml-endpoint
  MACHINE_TYPE: n1-standard-4
  ACCELERATOR_TYPE: nvidia-tesla-t4
  ACCELERATOR_COUNT: "1"
  MIN_REPLICA_COUNT: "1"
  MAX_REPLICA_COUNT: "1"

jobs:
  build-and-deploy-ml:
    continue-on-error: true
    concurrency:
      group: ml-cd-gcp-cloudrun-global
      cancel-in-progress: true
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_VERTEX_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Ensure Artifact Registry exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location "${{ env.GCP_REGION }}" || \
          gcloud artifacts repositories create "${{ env.AR_REPO }}" \
            --repository-format=docker \
            --location "${{ env.GCP_REGION }}" \
            --description="Pocketree ML images"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push ML Docker image
        id: build_image
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          docker build -f ml-service/Dockerfile -t "$IMAGE_URI" ml-service
          docker push "$IMAGE_URI"

      - name: Ensure Vertex AI Endpoint exists
        id: ensure_endpoint
        run: |
          set -euo pipefail
          unset CLOUDSDK_API_ENDPOINT_OVERRIDES_AIPLATFORM
          ENDPOINT_ID="$(gcloud ai endpoints list \
            --region "${{ env.GCP_REGION }}" \
            --filter="display_name=${{ env.ENDPOINT_DISPLAY_NAME }}" \
            --limit=1 \
            --format="value(name)")"

          if [ -z "$ENDPOINT_ID" ]; then
            ENDPOINT_ID="$(gcloud ai endpoints create \
              --region "${{ env.GCP_REGION }}" \
              --display-name "${{ env.ENDPOINT_DISPLAY_NAME }}" \
              --format="value(name)")"
          fi

          echo "ENDPOINT_ID=$ENDPOINT_ID" >> "$GITHUB_ENV"
          echo "endpoint_id=$ENDPOINT_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve MODEL_ID
        id: resolve_model
        run: |
          set -euo pipefail
          unset CLOUDSDK_API_ENDPOINT_OVERRIDES_AIPLATFORM
          MODEL_ID="$(gcloud ai models list \
            --region "${{ env.GCP_REGION }}" \
            --filter="display_name=${{ env.MODEL_DISPLAY_NAME }}" \
            --sort-by="~createTime" \
            --limit=1 \
            --format="value(name)" || true)"
          if [ -z "${MODEL_ID:-}" ]; then
            MODEL_ID="${{ env.FALLBACK_MODEL_ID }}"
            echo "No latest model found for display name '${{ env.MODEL_DISPLAY_NAME }}'. Using fallback MODEL_ID=$MODEL_ID"
          fi
          echo "MODEL_ID=$MODEL_ID" >> "$GITHUB_ENV"
          echo "model_id=$MODEL_ID" >> "$GITHUB_OUTPUT"

      - name: Enforce Single Deployment (Undeploy Existing)
        run: |
          set -euo pipefail
          unset CLOUDSDK_API_ENDPOINT_OVERRIDES_AIPLATFORM
          gcloud ai endpoints describe "$ENDPOINT_ID" \
            --region "${{ env.GCP_REGION }}" \
            --format="json" > endpoint_current.json || true
          deployed_ids=$(python - <<'PY'
          import json
          from pathlib import Path

          p = Path("endpoint_current.json")
          if not p.exists():
              print("")
              raise SystemExit(0)
          text = p.read_text(encoding="utf-8", errors="ignore").strip()
          if not text:
              print("")
              raise SystemExit(0)
          data = json.loads(text)
          ids = [dm.get("id") for dm in data.get("deployedModels", []) if dm.get("id")]
          print(" ".join(ids))
          PY
          )
          if [ -n "$deployed_ids" ]; then
            for id in $deployed_ids; do
              echo "Undeploying existing deployment $id"
              gcloud ai endpoints undeploy-model "$ENDPOINT_ID" \
                --region "${{ env.GCP_REGION }}" \
                --deployed-model-id "$id"
            done
          else
            echo "No existing deployments to remove."
          fi

      - name: Deploy Model to Vertex AI Endpoint
        run: |
          set -euo pipefail
          unset CLOUDSDK_API_ENDPOINT_OVERRIDES_AIPLATFORM
          gcloud ai endpoints deploy-model "$ENDPOINT_ID" \
            --region "${{ env.GCP_REGION }}" \
            --model "$MODEL_ID" \
            --display-name "pocketree-ml-deploy" \
            --machine-type "${{ env.MACHINE_TYPE }}" \
            --accelerator "type=${{ env.ACCELERATOR_TYPE }},count=${{ env.ACCELERATOR_COUNT }}" \
            --min-replica-count "${{ env.MIN_REPLICA_COUNT }}" \
            --max-replica-count "${{ env.MAX_REPLICA_COUNT }}" \
            --traffic-split "0=100"

  deploy-ml-v2-cloud-run:
    continue-on-error: true
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    env:
      GCP_PROJECT_ID: pocketree-ml-service
      GCP_REGION: asia-southeast1
      AR_REPO: pocketree-ml
      IMAGE_NAME: pocketree-ml-v2
      SERVICE_NAME: pocketree-ml
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Ensure Artifact Registry exists
        run: |
          gcloud artifacts repositories describe "${{ env.AR_REPO }}" \
            --location "${{ env.GCP_REGION }}" || \
          gcloud artifacts repositories create "${{ env.AR_REPO }}" \
            --repository-format=docker \
            --location "${{ env.GCP_REGION }}" \
            --description="Pocketree ML images"

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ env.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push ML Docker image (v2)
        id: build_image_v2
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "image_uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          docker build -f ml-service-chat/Dockerfile -t "$IMAGE_URI" ml-service-chat
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run (v2)
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            set +e
            out=$(gcloud run deploy "${{ env.SERVICE_NAME }}" \
              --project "${{ env.GCP_PROJECT_ID }}" \
              --region "${{ env.GCP_REGION }}" \
              --platform managed \
              --image "$IMAGE_URI" \
              --port 8080 \
              --cpu 4 \
              --memory 12Gi \
              --timeout 1200 \
              --concurrency 2 \
              --min-instances 1 \
              --max-instances 3 \
              --cpu-boost \
              --ingress all \
              --set-env-vars "GUNICORN_CMD_ARGS=--timeout 600 --preload --workers 1" \
              --allow-unauthenticated 2>&1)
            code=$?
            set -e
            echo "$out"
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if echo "$out" | grep -q "ABORTED: Conflict for resource"; then
              echo "Cloud Run revision conflict detected, retrying ($i/3)..."
              sleep 20
            else
              exit "$code"
            fi
          done
          echo "Deployment failed after retries due to repeated conflicts."
          exit 1

  deploy-ml-v3-azure:
    continue-on-error: true
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USER }}/pocketree-ml-v3
      AZURE_WEBAPP_NAME: pocketree-ml-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Extract Docker metadata
        id: meta_v3
        uses: docker/metadata-action@v5.9.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push Docker image (v3)
        uses: docker/build-push-action@v6.18.0
        with:
          context: ml-service-classify
          file: ml-service-classify/Dockerfile
          push: true
          tags: ${{ steps.meta_v3.outputs.tags }}
          labels: ${{ steps.meta_v3.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure Login
        uses: azure/login@v2.3.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App (v3)
        uses: azure/webapps-deploy@v2.2.17
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: '${{ env.IMAGE_NAME }}:sha-${{ github.sha }}'
