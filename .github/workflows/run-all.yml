name: 1e) Run All Workflows

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

    - cron: "0 20 * * *"
permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger all workflows
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const workflows = [
              "api-ci.yml",
              "api-cd.yml",
              "api-dast.yml",
              "android-ci.yml",
              "android-ui-test.yml",
              "android-release.yml",
              "android-mobsfscan.yml",
              "code-quality.yml",
              "contribution-report.yml",
              "ml-service-ci.yml",
              "ml-service-cd.yml",
              "ml-service-v2-ci.yml",
              "ml-service-v2-cd.yml",
              "ml-service-v3-ci.yml",
              "ml-service-v3-cd.yml",
              "ml-dast.yml",
              "Pipeline Artifacts.yml",
              "security-report.yml"
            ];

            for (const wf of workflows) {
              core.info(`Dispatching ${wf}`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf,
                ref: context.ref.replace("refs/heads/", "")
              });
            }

