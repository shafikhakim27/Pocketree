name: Run All Pipelines

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger all workflows
        uses: actions/github-script@v7.0.1
        with:
          script: |
            const workflows = [
              "api-ci.yml",
              "api-cd.yml",
              "api-dast.yml",
              "ml-service-ci.yml",
              "ml-service-cd.yml",
              "ml-dast.yml",
              "android-ci.yml",
              "android-ui-test.yml",
              "android-release.yml",
              "android-mobsfscan.yml",
              "security-report.yml",
              "code-quality.yml",
              "contribution-report.yml",
              "Pipeline Artifacts.yml"
            ];

            for (const wf of workflows) {
              core.info(`Dispatching ${wf}`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: wf,
                ref: context.ref.replace("refs/heads/", "")
              });
            }

