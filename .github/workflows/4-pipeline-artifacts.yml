name: 4. Pipeline Compiled Artifacts

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "0. Contribution Report"
      - "1. Code Quality"
      - "2. Code Coverage"
      - "3. Security Tests Report"
      - "5. Android CI/CD"
      - "6. API CI (Build, Test, Scan, SAST)"
      - "7. API CD (Deploy - Azure)"
      - "8. ML CI (Build, Test, Scan, SAST)"
      - "9. ML CD (Deploy - GCP)"
      - "9x. ML Security (Scans + DAST)"
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: 4-pipeline-artifacts-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare workspace
        run: |
          mkdir -p collected

      - name: Resolve source run
        id: source
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "workflow_name=${{ github.event.workflow_run.name }}" >> "$GITHUB_OUTPUT"
            echo "conclusion=${{ github.event.workflow_run.conclusion }}" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "workflow_name=manual-dispatch" >> "$GITHUB_OUTPUT"
            echo "conclusion=n/a" >> "$GITHUB_OUTPUT"
            echo "head_sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Save run metadata
        run: |
          cat > collected/run-metadata.json <<'JSON'
          {
            "repository": "${{ github.repository }}",
            "collector_run_id": "${{ github.run_id }}",
            "source_run_id": "${{ steps.source.outputs.run_id }}",
            "source_workflow": "${{ steps.source.outputs.workflow_name }}",
            "source_conclusion": "${{ steps.source.outputs.conclusion }}",
            "source_head_sha": "${{ steps.source.outputs.head_sha }}",
            "event_name": "${{ github.event_name }}"
          }
          JSON

      - name: Download source run artifacts
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p collected/source-artifacts
          if ! gh run download "${{ steps.source.outputs.run_id }}" -D collected/source-artifacts; then
            echo "No artifacts found for source run ${{ steps.source.outputs.run_id }}" > collected/no-artifacts.txt
          fi

      - name: Download source run logs
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${{ github.repository }}/actions/runs/${{ steps.source.outputs.run_id }}/logs" > collected/source-run-logs.zip; then
            echo "Unable to download logs for source run ${{ steps.source.outputs.run_id }}" > collected/no-logs.txt
          fi

      - name: Build index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime, timezone

          root = Path("collected")
          files = [str(p) for p in sorted(root.rglob("*")) if p.is_file()]
          meta_path = root / "run-metadata.json"
          meta = {}
          if meta_path.exists():
            meta = json.loads(meta_path.read_text(encoding="utf-8"))
          index = {
            "generated_at_utc": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
            "metadata": meta,
            "files": files
          }
          (root / "INDEX.json").write_text(json.dumps(index, indent=2), encoding="utf-8")
          lines = [
            "Pipeline Artifacts Bundle",
            f"Repository: {meta.get('repository', '')}",
            f"Source workflow: {meta.get('source_workflow', '')}",
            f"Source run id: {meta.get('source_run_id', '')}",
            f"Source conclusion: {meta.get('source_conclusion', '')}",
            "",
            "Files:"
          ] + files
          (root / "INDEX.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          cat collected/INDEX.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload collected bundle
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: pipeline-artifacts-run-${{ steps.source.outputs.run_id }}
          path: collected/
