name: 4c) ML DAST

on:
  workflow_run:
    workflows: ["4b) ML CD (Deploy -GCP)", "4f) ML CD (v2 Cloud Run)", "4g) ML CD (v3 Azure)"]
    types:
      - completed
  workflow_dispatch:

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - https://pocketree-ml-500550710563.asia-southeast1.run.app
          - https://pocketree-ml-service.azurewebsites.net
    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ matrix.target }}
          cmd_options: "-J zap_report.json -r zap_report.html"
          fail_action: false

      - name: Fail on High Confidence Alerts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("zap_report.json")
          if not report.exists():
              print("ZAP report not found; skipping confidence check.")
              raise SystemExit(0)

          data = json.loads(report.read_text(encoding="utf-8", errors="ignore"))
          alerts = []
          for site in data.get("site", []):
              alerts.extend(site.get("alerts", []))

          high = [a for a in alerts if str(a.get("confidence", "")).lower() == "high"]
          print(f"Total alerts: {len(alerts)} | High confidence: {len(high)}")
          if high:
              raise SystemExit(1)
          PY

      - name: Build ZAP Text Report
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = Path("zap_report.json")
          out = Path("zap_report.txt")
          if not report.exists():
            out.write_text("ZAP report not found.\n", encoding="utf-8")
            raise SystemExit(0)
          data = json.loads(report.read_text(encoding="utf-8", errors="ignore") or "{}")
          alerts = []
          for site in data.get("site", []):
            alerts.extend(site.get("alerts", []))
          high = [a for a in alerts if str(a.get("confidence", "")).lower() == "high"]
          lines = [
            "ZAP Baseline Report",
            f"Total alerts: {len(alerts)}",
            f"High confidence alerts: {len(high)}",
            "Target: ${{ matrix.target }}"
          ]
          out.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload ZAP Report
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-zap-report
          path: |
            ${{ github.workspace }}/zap_report.json
            ${{ github.workspace }}/zap_report.txt

      - name: Build Summary
        if: always()
        run: |
          cat > summary.json <<'JSON'
          {
            "summary": "ML Service DAST Summary",
            "zap_baseline": "Completed",
            "target": "${{ matrix.target }}"
          }
          JSON
          cat > summary.txt <<'TXT'
          ML Service DAST Summary
          ZAP Baseline: Completed
          Target: ${{ matrix.target }}
          TXT

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: ml-dast-summary
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

