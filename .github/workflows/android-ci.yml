name: Android Build & Unit Test

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"
  push:
    branches: ["main", "develop"]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6.0.2

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: android-unit-test-reports
          path: |
            ${{ github.workspace }}/android/app/build/reports/tests/testDebugUnitTest/
            ${{ github.workspace }}/android/app/build/test-results/testDebugUnitTest/


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: pocketree-debug.apk
          path: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build Summary
        if: always()
        run: |
          cat > summary.json <<'JSON'
          {
            "summary": "Android CI Summary",
            "unit_tests": "Completed",
            "apk_build": "Completed"
          }
          JSON
          cat > summary.txt <<'TXT'
          Android CI Summary
          Unit Tests: Completed
          APK Build: Completed
          TXT

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v6.0.0
        with:
          if-no-files-found: warn
          name: android-ci-summary
          path: |
            ${{ github.workspace }}/summary.json
            ${{ github.workspace }}/summary.txt

