name: Android Build & Unit Test

on:
  push:
    branches: ["main", "develop"]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            ${{ github.workspace }}/android/app/build/reports/tests/testDebugUnitTest/
            ${{ github.workspace }}/android/app/build/test-results/testDebugUnitTest/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketree-debug.apk
          path: ${{ github.workspace }}/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Build Summary
        if: always()
        run: |
          echo "Android CI Summary" > "$GITHUB_WORKSPACE/summary.txt"
          echo "Unit Tests: Completed" >> "$GITHUB_WORKSPACE/summary.txt"
          echo "APK Build: Completed" >> "$GITHUB_WORKSPACE/summary.txt"

      - name: Upload Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ci-summary
          path: ${{ github.workspace }}/summary.txt
