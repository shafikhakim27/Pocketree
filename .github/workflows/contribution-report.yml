name: Contribution Report

on:
  workflow_dispatch:
  schedule:
    - cron: "45 4 * * *"

permissions:
  contents: read

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Contribution Report
        run: |
          mkdir -p report
          echo "Contribution Report" > report/contribution-report.txt
          echo "Repository: ${{ github.repository }}" >> report/contribution-report.txt
          echo "Generated: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> report/contribution-report.txt
          echo "" >> report/contribution-report.txt
          echo "Commits by Author:" >> report/contribution-report.txt
          git shortlog -sne >> report/contribution-report.txt
          echo "" >> report/contribution-report.txt
          echo "Recent Activity (last 30 commits):" >> report/contribution-report.txt
          git log -n 30 --pretty=format:"%h %ad %an %s" --date=short >> report/contribution-report.txt

      - name: Upload Contribution Report
        uses: actions/upload-artifact@v4
        with:
          name: contribution-report
          path: ${{ github.workspace }}/report/
