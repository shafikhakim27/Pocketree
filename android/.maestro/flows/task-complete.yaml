appId: com.pocketree.app
---
# --- Complete a Task ---
# Reference: @string/tab_tasks ("Tasks"), @string/complete_task ("Complete Task"), @string/task_completed ("Task Completed!")
- tapOn: "Tasks"
- assertVisible:
    id: "recyclerViewTasks"
# Tap the first action button in the task list
- tapOn:
    id: "actionBtn"
    index: 0
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: android/.maestro/screenshots/Task_Completion_Success
