appId: com.pocketree.app
---
# --- Complete a Task ---
# Reference: @string/tab_tasks ("Tasks"), @string/complete_task ("Complete Task"), @string/task_completed ("Task Completed!")
- tapOn: "Tasks"
- assertVisible:
    id: "taskList"
# This assumes the first task in the list is tappable
- tapOn:
    id: "taskListItem-0"
- assertVisible:
    id: "taskDetailView"
- assertVisible: "Complete Task"
- tapOn: "Complete Task"
- assertVisible: "Task Completed!"
- tapOn: "OK"
- takeScreenshot: .maestro/screenshots/Task_Completion_Success