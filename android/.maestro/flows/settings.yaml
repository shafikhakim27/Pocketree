appId: com.pocketree.app
---
# --- Navigate to Settings ---
# Reference: @string/notifications ("Notifications"), @string/account ("Account")
# @string/logout_button ("Logout")
- tapOn:
    id: "settingsButton"
- assertVisible:
    id: "settingsView"
- assertVisible: "Notifications"
- assertVisible: "Account"
- assertVisible: "Logout"
- takeScreenshot: .maestro/screenshots/Settings_Screen
