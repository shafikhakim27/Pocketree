appId: com.pocketree.app
---
- launchApp:
    appId: "com.pocketree.app"
    clearState: true

- waitForAnimationToEnd:
    timeout: 5000

- waitFor:
    id: "username"
    timeout: 15000

- assertVisible:
    id: "username"
- assertVisible:
    id: "password"

- tapOn:
    id: "username"
- inputText: "ecotester"
- tapOn:
    id: "password"
- inputText: "password123"
- tapOn:
    id: "loginButton"