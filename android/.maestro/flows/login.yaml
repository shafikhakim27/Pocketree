appId: com.pocketree.app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd:
    timeout: 15000

# --- Login Screen ---
- assertVisible: "Welcome!\\s*Please log in"
- assertVisible:
    id: "username"
- assertVisible:
    id: "password"
- tapOn:
    id: "username"
- inputText: "ecotester"
- tapOn:
    id: "password"
- inputText: "password123"
- pressKey: Back
- tapOn:
    id: "loginButton"
