appId: com.pocketree.app
---
# --- Redeem Skin ---
- runFlow: home.yaml
- tapOn: "Redeem"
- tapOn:
    text: "OK"
    optional: true
- assertVisible:
    id: "recyclerViewSkin"
    optional: true
- assertVisible:
    id: "recyclerViewVoucher"
    optional: true
# Tap the first skin item in the grid (if present)
- tapOn:
    id: "itemContainer"
    index: 0
    optional: true
- tapOn:
    text: "EQUIP"
    optional: true
- tapOn:
    text: "OK"
    optional: true
- takeScreenshot: android/.maestro/screenshots/Redeem_Skin_Success
