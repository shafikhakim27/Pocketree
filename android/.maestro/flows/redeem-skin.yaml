appId: com.pocketree.app
---
# --- Redeem Skin ---
# Reference: @string/redeem ("Redeem"), @string/redeem_header ("Redeem Items")
# @string/confirm_redemption ("Confirm Redemption"), @string/confirm ("Confirm")
# @string/redemption_successful ("Redemption Successful!"), @string/ok ("OK")
- tapOn: "Redeem"
- assertVisible:
    id: "recyclerViewSkin"
- assertVisible:
    id: "recyclerViewVoucher"
# Tap the first skin item in the grid
- tapOn:
    id: "itemContainer"
    index: 0
- assertVisible: "Confirm Redemption"
- tapOn: "Confirm"
- assertVisible: "Redemption Successful!"
- tapOn: "OK"
- takeScreenshot: .maestro/screenshots/Redeem_Skin_Success
